# ===========================================
# Docker Compose - stack legado embebido
# ===========================================
# INF-07: NO es el archivo que DEPLOY.md instala en Hetzner. La fuente de
# verdad es docker-compose.prod.yml (GHCR por digest, Postgres y Redis
# externos). Este archivo se conserva para el server que todavía buildea
# en local y trae Postgres y Redis propios. Los controles de INF-08
# (cap_drop, no-new-privileges, logs) están alineados con el otro archivo.
# Ver docs/runbooks/infra-cicd-v6.md.
# Frontend: Cloudflare Pages (NO incluido).
# PostgreSQL + Redis: propios de este stack.
# Caddy (deploy/Caddyfile) rutea por host, no por path:
#   cc10demayo-api.javierzader.com   → consorcio-backend:8000
#   cc10demayo-tiles.javierzader.com → consorcio-martin:3000
#
# Uso:
#   cd ~/stacks/consorcio
#   cp .env.deploy.example .env  # editar valores reales
#   docker compose -f docker-compose.deploy.yml up -d --build
# ===========================================

x-hardening: &hardening
  # INF-08. Servicios que arrancan como root y bajan de usuario agregan cap_add.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-readonly: &readonly
  read_only: true
  tmpfs:
    - /tmp:size=134217728,mode=1777

services:
  # --- PostgreSQL + PostGIS + pgRouting ---
  postgres:
    <<: *hardening
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # DB-05: Postgres 16 + PostGIS 3.5 + pgRouting 3.8, fijada por digest.
    # Minor dentro de 16: no hace falta dump. Seguir el runbook antes de recrear.
    image: pgrouting/pgrouting:16-3.5-3.8@sha256:4c480c7f9e25a3490573cd6ef86b286fd21162e288cc355e8da2b52518ef6ab8
    container_name: consorcio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: consorcio
      POSTGRES_USER: ${DB_USER:-consorcio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - consorcio-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-consorcio} -d consorcio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Redis ---
  redis:
    <<: *hardening
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: consorcio-redis
    restart: unless-stopped
    # AOF persistence: redis is Celery broker + result backend — losing it
    # drops in-flight tasks and beat state on restart.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - consorcio-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # --- One-shot DB migration runner ---
  # Runs `alembic upgrade head` against the production DB and exits 0.
  # The backend and celery-worker depend on this with
  # ``service_completed_successfully`` so they never start against an
  # out-of-date schema. If the migration fails, dependents don't start
  # and the deploy fails loudly instead of producing 500s at runtime.
  migrate:
    <<: [*hardening, *readonly]
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: production
    container_name: consorcio-migrate
    env_file: .env
    command: alembic upgrade head
    volumes:
      - ./credentials:/app/credentials:ro
    networks:
      - consorcio-internal
    environment:
      HOME: /tmp
      TMPDIR: /tmp
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Named volume ownership repair. Same contract as docker-compose.prod.yml.
  uploads-init:
    <<: *hardening
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: production
    container_name: consorcio-uploads-init
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command:
      - sh
      - -ec
      - |
        chown -R app:app /app/uploads
        chmod 0750 /app/uploads
    volumes:
      - denuncia-uploads:/app/uploads
    network_mode: none
    read_only: true
    restart: "no"

  # --- Backend FastAPI ---
  backend:
    <<: [*hardening, *readonly]
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: production
    container_name: consorcio-backend
    restart: unless-stopped
    env_file: .env
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      # DB-04: runtime is consorcio_app (no SUPERUSER). Until APP_DATABASE_URL
      # is set, this is the same URL as migrate.
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
      # Trust only loopback and the exact Caddy peer resolved by app.server.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,caddy}
    volumes:
      - geo-data:/data/geo
      - ./gee-backend/data/waterways:/app/data/waterways:ro
      - ./credentials:/app/credentials:ro
      # Persist denuncia photos so they survive container rebuilds.
      - denuncia-uploads:/app/uploads
    networks:
      - proxy
      - consorcio-internal
    healthcheck:
      # Liveness only. /live doesn't touch DB/Redis/GEE — a transient
      # outage downstream must NOT kill this container. The Python probe
      # keeps transport on loopback and derives a TrustedHost-safe Host header.
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      # GEE auth + lazy imports take 5–15 s on cold start; give 60 s margin
      # so the container isn't marked unhealthy before it can answer.
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- One-shot Celery Beat schedule ownership repair ---
  celery-beat-init:
    <<: *hardening
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: production
    container_name: consorcio-celery-beat-init
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        chown -R app:app /var/run/celery
        chmod 0750 /var/run/celery
    volumes:
      - celery-beat-schedule:/var/run/celery
    network_mode: none
    read_only: true
    restart: "no"

  # --- Celery Beat (cron scheduler) ---
  # Phase 3 / F3-L. See docker-compose.prod.yml for the rationale.
  celery-beat:
    <<: [*hardening, *readonly]
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: production
    container_name: consorcio-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/var/run/celery/celerybeat-schedule
    env_file: .env
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
    volumes:
      - ./credentials:/app/credentials:ro
      - celery-beat-schedule:/var/run/celery
    networks:
      - consorcio-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      celery-beat-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Override the backend image HEALTHCHECK (HTTP /live:8000). Beat has no
    # Uvicorn — that probe always fails while the scheduler is fine.
    healthcheck:
      test: ["CMD", "python", "-m", "app.beat_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # --- Celery Worker ---
  celery-worker:
    <<: [*hardening, *readonly]
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: production
    container_name: consorcio-celery-worker
    restart: unless-stopped
    # ``--pool=prefork`` is REQUIRED — celery_app.purge_stale_refresh_tokens_task
    # uses ``asyncio.run`` which only works without an already-running event
    # loop. gevent / eventlet pools would crash that beat task.
    command: celery -A app.core.celery_app worker --pool=prefork --loglevel=info --concurrency=2 -Q celery
    env_file: .env
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
    volumes:
      - geo-data:/data/geo
      - ./credentials:/app/credentials:ro
    networks:
      - consorcio-internal
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Geo Worker (GDAL + WhiteboxTools) ---
  geo-worker:
    <<: *hardening
    # INF-08: sin read_only. supervisord y WhiteboxTools escriben dentro de la imagen.
    build:
      context: ./gee-backend
      dockerfile: Dockerfile.geo
    container_name: consorcio-geo-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
    volumes:
      - geo-data:/data/geo
      - ./gee-backend/data/waterways:/app/data/waterways:ro
      # Zona outline for clipping visual raster tiles to the consorcio —
      # parity with dev and prod composes. Missing file → docker creates a
      # DIRECTORY and the clip silently degrades to unclipped overlays.
      # After updating the geojson: `docker compose up -d --force-recreate
      # geo-worker` (single-file bind = stale inode + process cache).
      - ./consorcio-web/public/capas/pilar-verde/zona_ampliada.geojson:/app/data/zona/zona_ampliada.geojson:ro
      - ./gee-backend/supervisord-geo.conf:/etc/supervisor/conf.d/geo.conf:ro
      - ./credentials:/app/credentials:ro
    networks:
      - consorcio-internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Martin Vector Tile Server ---
  martin:
    <<: [*hardening, *readonly]
    image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
    container_name: consorcio-martin
    restart: unless-stopped
    volumes:
      - ./martin-config.deploy.yaml:/config/config.yaml:ro
    command: --config /config/config.yaml
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      # Fail closed: never inherit or fall back to the application owner URL.
      DATABASE_URL: ${MARTIN_DB_URL:?MARTIN_DB_URL is required for the dedicated read-only Martin role}
    networks:
      - proxy
      - consorcio-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # INF-02 / INF-13. Opt-in: docker compose --profile backup run --rm backup-postgres
  backup-postgres:
    <<: *hardening
    profiles: ["backup"]
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: consorcio-backup-postgres
    restart: "no"
    env_file: .env
    command: ["/opt/backup/backup_postgres.sh"]
    networks:
      - consorcio-internal

  backup-volumes:
    <<: *hardening
    profiles: ["backup"]
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: consorcio-backup-volumes
    restart: "no"
    env_file: .env
    volumes:
      - geo-data:/data/geo:ro
      - denuncia-uploads:/app/uploads:ro
    command: ["/opt/backup/backup_volumes.sh"]
    networks:
      - consorcio-internal

networks:
  proxy:
    external: true
  consorcio-internal:
    driver: bridge
    name: consorcio-internal

volumes:
  postgres-data:
    name: consorcio-postgres-data
  geo-data:
    name: consorcio-geo-data
  denuncia-uploads:
    name: consorcio-denuncia-uploads
  redis-data:
    name: consorcio-redis-data
  # Durable singleton Celery Beat schedule state; never recreated by init.
  celery-beat-schedule:
    name: consorcio-celery-beat-schedule
