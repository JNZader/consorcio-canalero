<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Font preloads are NOT written here: the woff2 assets are content-hashed
      at build time, so `<link rel="preload">` for the two above-the-fold faces
      (dm-serif-display 400 + inter 400) is injected into <head> by the
      `consorcio:preload-critical-fonts` plugin in vite.config.ts, which reads
      the final hashed filenames out of the bundle. Nothing to keep in sync by
      hand — the build fails loudly if either asset stops being emitted.
    -->

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- manifest.webmanifest is injected by vite-plugin-pwa -->

    <!-- Theme Color -->
    <meta name="theme-color" content="#2d9970" />
    <meta name="msapplication-TileColor" content="#2d9970" />

    <!-- SEO Meta Tags -->
    <title>Consorcio Canalero 10 de Mayo</title>
    <meta
      name="description"
      content="Sistema de gestion y monitoreo satelital de cuencas hidricas del Consorcio Canalero 10 de Mayo. Infraestructura para el desarrollo agricola de la region."
    />
    <meta name="keywords" content="consorcio canalero, cuencas hidricas, monitoreo satelital, agricultura, drenaje, infraestructura hidrica, cordoba" />
    <meta name="author" content="Consorcio Canalero 10 de Mayo" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://consorcio10demayo.gob.ar/" />
    <meta property="og:title" content="Consorcio Canalero 10 de Mayo" />
    <meta property="og:description" content="Sistema de gestion y monitoreo satelital de cuencas hidricas. Infraestructura para el desarrollo agricola." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Consorcio Canalero 10 de Mayo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Consorcio Canalero 10 de Mayo" />
    <meta name="twitter:description" content="Sistema de gestion y monitoreo satelital de cuencas hidricas." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="AR-X" />
    <meta name="geo.placename" content="Cordoba, Argentina" />

    <!--
      PERF — preconnect to the API origin, and ONLY to the API origin.

      The app contacts the API during boot (``configStore.fetchConfig`` runs at
      module scope, ``authStore.initialize`` right after mount) and that origin
      costs ~620 ms of DNS + TLS handshake from a mobile link. Warming it here
      takes that handshake off the critical path.

      The map tile hosts (tile.openstemap / arcgisonline, below) used to be
      preconnected instead. That was the wrong call: ``/`` never touches them,
      and the first tile request only happens ~2 s after a user navigates to
      ``/mapa``. A preconnect that nobody redeems inside ~10 s is dropped by
      the browser anyway, and each one competes for the same handful of early
      connection slots the API and the fonts need. They keep ``dns-prefetch``
      (R4-003): it costs no connection slot, and an installed-PWA user tapping
      the "Ver Mapa" manifest shortcut lands on ``/mapa`` directly — the DNS
      leg is the one part of that cold start this page can still pay forward.

      NOTE: the host is hardcoded because ``index.html`` is static and there is
      exactly one deployment (see ``docker-compose.deploy.yml`` / ``RUNBOOK``).
      In local dev this preconnect goes unredeemed — one dropped connection
      attempt, no correctness impact. If a second deployment ever appears, wire
      it through ``transformIndexHtml`` reading ``VITE_API_URL`` rather than
      adding a second literal here.
    -->
    <link rel="preconnect" href="https://cc10demayo-api.javierzader.com" crossorigin />
    <link rel="dns-prefetch" href="https://earthengine.googleapis.com" />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />

    <!--
      F5-I: schema.org LocalBusiness for local SEO. Helps Google
      surface the consorcio's address + contact in the knowledge
      panel for queries like "consorcio canalero Bell Ville".
      Keep ``url`` / ``telephone`` / ``email`` in sync with the
      values rendered in the Footer + Contact section.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GovernmentOrganization",
        "name": "Consorcio Canalero 10 de Mayo",
        "alternateName": "Consorcio 10 de Mayo",
        "url": "https://consorcio10demayo.gob.ar/",
        "logo": "https://consorcio10demayo.gob.ar/icons/icon-512.png",
        "description": "Consorcio canalero de Bell Ville, Córdoba. Gestión territorial, monitoreo satelital de cuencas, caminos rurales e infraestructura hídrica.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bell Ville",
          "addressRegion": "Córdoba",
          "addressCountry": "AR"
        },
        "email": "contacto@consorcio10demayo.gob.ar",
        "telephone": "+54 353 4000000",
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Bell Ville, Córdoba, Argentina"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
