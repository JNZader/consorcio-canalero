name: CodeQL

on:
  # main too, not just PRs: alerts are only auto-closed as ``fixed`` when a
  # scan of the DEFAULT BRANCH stops reporting them. Without this, a finding
  # remediated after its scan (alert #3, py/path-injection, fixed by
  # PRs #25/#27/#28) stays "open" until the Monday cron, and the security tab
  # keeps showing a vulnerability that no longer exists in the code.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    # Every Monday at 09:00 ART (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# CI-01: el token por defecto solo lee. El job de análisis agrega security-events.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
        include:
          - language: javascript-typescript
            paths: consorcio-web/src
          - language: python
            paths: gee-backend/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          config: |
            paths:
              - ${{ matrix.paths }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
