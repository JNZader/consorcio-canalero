name: Backend

on:
  # Sin trigger de push: la rama ``develop`` no existe (era un trigger
  # muerto) y agregar ``main`` duplicaría los builds pesados de imagen que
  # deploy.yml ya hace en ese mismo evento (mismo scope de cache BuildKit,
  # geo-worker con GDAL construido dos veces). El gate de main para backend
  # es deploy.yml; este workflow cubre PRs y ejecución manual.
  # SIN filtro `paths:` a proposito. Un filtro de paths hace que el workflow
  # entero NO CORRA cuando el PR no toca esos archivos, y un check requerido
  # que nunca corre deja el PR colgado para siempre en "Expected — waiting for
  # status". El filtrado se mudo adentro, al job `changes`: el workflow arranca
  # SIEMPRE y los jobs caros se saltean solos cuando no hay nada que revisar.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Baseline canonica semanal: conserva evidencia completa aunque los PRs seleccionen dominio.
    - cron: "30 3 * * 0"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gee-backend

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      backend_image: ${{ steps.detect.outputs.backend_image }}
      mutation_matrix: ${{ steps.detect.outputs.mutation_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: sin esto el merge-base contra la rama base no
          # existe en el clon y el diff de abajo falla o miente.
          fetch-depth: 0
      - id: detect
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fuera de un pull_request no hay contra que diffear (en el primer
          # push de una rama `before` es todo ceros), asi que se declara todo
          # cambiado: preferimos correr de mas antes que saltear en silencio.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "backend_image=true" >> "$GITHUB_OUTPUT"
            python3 gee-backend/scripts/cosmic_mutation_plan.py --full --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tres puntos = merge-base. Con dos puntos, un avance de la rama base
          # posterior a la apertura del PR aparecerria como cambio del PR.
          git diff --name-status "$BASE_SHA...HEAD" > "$RUNNER_TEMP/backend-changes.txt"
          # Rename/copy records carry TWO tab-separated paths (old and new). A
          # bare `cut -f2-` keeps both in ONE line, so the anchored regex below would only see
          # the OLD path: a rename INTO gee-backend/ would set backend=false and
          # skip tests, mutation, and security. Split both fields into separate
          # lines so each path is matched on its own.
          CHANGED="$(cut -f2- "$RUNNER_TEMP/backend-changes.txt" | tr '\t' '\n')"
          if printf '%s\n' "$CHANGED" | grep -qE '^(gee-backend/|\.github/workflows/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            python3 gee-backend/scripts/cosmic_mutation_plan.py --status-file "$RUNNER_TEMP/backend-changes.txt" --github-output "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo 'mutation_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          fi
          # Image scans (~17 min, GDAL) only when the production image bytes
          # can change. Tests / requirements-dev.lock / workflow comments must
          # not rebuild Debian just to rediscover libexpat CVEs.
          if printf '%s\n' "$CHANGED" | grep -qE '^(gee-backend/Dockerfile|gee-backend/Dockerfile\.geo|gee-backend/requirements\.lock|gee-backend/requirements\.txt|gee-backend/requirements-geo\.txt|gee-backend/security/frozen-image-debt\.json|gee-backend/scripts/validate_image_security_policy\.py)'; then
            echo "backend_image=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_image=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gee-backend/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      # Trivy's filesystem scan does NOT parse .lock files, so pinning the
      # closure would otherwise blind the manifest-level vulnerability gate.
      # pip-audit reads the pins directly and fails closed.
      - name: Audit pinned dependencies
        run: |
          pip-audit -r requirements.lock
          pip-audit -r requirements-dev.lock

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gee-backend/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      # mypy.ini runs strict (ignore_missing_imports=False) on the three
      # PII/auth-sensitive modules. Scope is intentional — typing the
      # entire app/ is roadmap F4, not Phase 1.
      - run: mypy app/auth app/domains/padron app/domains/denuncias

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gee-backend/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      # Unified coverage floor: 60 everywhere (backend.yml, deploy.yml,
      # package.json test:backend) — the real prod gate is deploy.yml's 60.
      #
      # Los tests del renderer VTK offscreen corren en un PROCESO pytest
      # separado: compartir proceso con el resto de la suite producia
      # segfaults intermitentes en el runner headless (2026-07-30, 4/4 en un
      # PR) — el estado nativo que otros tests cargan en coleccion (GEOS,
      # rasterio, etc.) desestabiliza el contexto GL de VTK. Aislarlo mata la
      # clase entera de problema, sin depender de que import hace quien.
      # El coverage se combina con --cov-append; el umbral se evalua al final.
      - run: pytest tests/new/test_geo_visualization_renderer.py -v --cov=app
      - run: >
          pytest tests/ -v --ignore=tests/new/test_geo_visualization_renderer.py
          --cov=app --cov-append --cov-fail-under=60

  mutation:
    name: Mutation tests (cosmic-ray — ${{ matrix.target }})
    # Solo en el PR de release (develop -> main) o a mano. Son 12 minutos de
    # runner por PR: correrlo en cada PR a develop fue parte de lo que hizo que
    # bloquearan la cuenta por consumo. La calidad de los tests no se degrada
    # de un PR al siguiente al punto de justificar ese peaje diario.
    if: ${{ (github.base_ref == 'main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.mutation_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gee-backend/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      # The versioned manifest selects only the changed domain. Tests, configs,
      # workflows, dependencies, unknown paths, renames and deletes run all targets.
      - run: >
          python3 scripts/cosmic_mutation_plan.py --target "${{ matrix.target }}"
          --write-config .cosmic-ray.selected.toml
      # Phase 4 / F4-B: raised the floor from 0.12 → 0.30 after seeding
      # the two test files referenced by ``.cosmic-ray.toml`` (they did
      # NOT exist before this batch — the gate had been mis-configured
      # to point at non-existent test paths and was effectively dead).
      # Measured baseline at commit time: 63.41% kill rate (175 killed
      # / 276 mutations) across denuncias/service.py, monitoring/service.py
      # and tramites/schemas.py — the 0.30 floor gives a ~33pp cushion
      # for natural drift while still catching the kind of regression
      # the gate exists to prevent.
      #
      # The module list has grown twice since that baseline, each time with
      # its own measurement recorded in ``.cosmic-ray.toml``: finanzas
      # (+74 mutations, 97.30% on this interpreter) and padron (+191,
      # 95.29%). Both land far above the floor, so 0.30 keeps widening its
      # cushion instead of narrowing it. Full gate at 541 mutations,
      # measured end to end: 75.23% (407/541) on the local 3.14 venv, which
      # the two stage write-ups show is the PESSIMISTIC interpreter — this
      # job's 3.11 kills 22 more annotation mutants on top (11 finanzas +
      # 11 padron, each measured per stage), so expect ~79% here; that half
      # is DERIVED, not measured end to end. Raising the floor is a separate
      # change anyway: the literal `--min-kill-rate 0.30` is asserted by
      # tests/test_ci_workflow_contracts.py here AND in deploy.yml.
      #
      # Wallclock budget: 19m33s measured for the 541 mutations on the
      # desktop 3.14 venv; 3.11 runs the same workload ~2x faster, and a GH
      # runner is 1.5-2x slower than the desktop → ~15-22 min expected.
      # Inside the 35-min timeout below, but the margin is now ~13 min and
      # not the ~20 it used to be: stage 3 (refresh_tokens, +300 mutations)
      # does NOT fit here and needs its own job.
      - run: >
          python3 scripts/cosmic_gate.py --config .cosmic-ray.selected.toml
          --session ".cosmic-ray-${{ matrix.target }}.sqlite" --min-kill-rate 0.30

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    # NO depende de `mutation`: un job que se saltea arrastra al salteo a todo
    # el que lo tenga en `needs`, y desde que la mutacion corre solo en el PR
    # de release eso habria apagado Trivy en cada PR a develop.
    needs: [changes, lint, typecheck, test]
    timeout-minutes: 5
    if: ${{ needs.changes.outputs.backend == 'true' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Pinned to commit SHA of v0.36.0 (peeled tag, verified via git ls-remote)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: gee-backend
          version: v0.70.0
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  image-backend:
    name: Final Backend Image Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint, typecheck, test]
    # ~17 minutos (el geo-worker trae GDAL). Solo cuando el diff puede cambiar
    # bytes de imagen (Dockerfile / runtime lock / frozen debt). Un PR de tests
    # no redescubre CVEs de Debian.
    if: ${{ (github.base_ref == 'main' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.backend_image == 'true' }}
    permissions:
      contents: read
      security-events: write
    env:
      CANDIDATE_IMAGE: "local/consorcio-backend:${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend candidate image
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}/gee-backend
          file: ${{ github.workspace }}/gee-backend/Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-image
          # BL-GHA-CACHE-CEILING (higiene A, 2026-08-26): este workflow SOLO
          # corre en PR / dispatch, y la imagen es un candidato que se escanea y
          # se descarta. Quien alimenta el scope `backend-image` para corridas
          # futuras es deploy.yml (publicacion desde main), que conserva
          # `mode=max`. Con `mode=max` aca cada PR escribia 300-400 MB de capas
          # intermedias contra el techo de 10 GB y el LRU desalojaba las
          # baselines de mutacion de ~1 MB (incidente PR #242).
          cache-to: type=gha,mode=min,scope=backend-image
      - name: Prepare backend evidence directory
        working-directory: ${{ github.workspace }}
        run: mkdir -p "${{ github.workspace }}/image-security"
      - name: Generate raw unsuppressed backend vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          version: v0.70.0
          scanners: vuln
          # El default de Trivy son 5m0s y el analisis del geo-worker no entra:
          # la imagen trae GDAL mas todo el arbol de dependencias de Python.
          # Reventaba con "context deadline exceeded" a los 5 minutos justos,
          # que no es un hallazgo de seguridad sino el reloj interno del
          # escaner. Sin evidencia generada, la politica de imagenes lo
          # reportaba como fallo -correctamente, porque fail-closed- pero el
          # motivo real quedaba enterrado tres pasos mas arriba.
          timeout: '20m'
          format: json
          output: ${{ github.workspace }}/image-security/backend-trivy.json
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Derive backend SARIF from the raw report
        working-directory: ${{ github.workspace }}
        run: trivy convert --format sarif --output "${{ github.workspace }}/image-security/backend-trivy.sarif" "${{ github.workspace }}/image-security/backend-trivy.json"
      - name: Validate frozen backend image debt
        working-directory: ${{ github.workspace }}
        run: |
          EXPECTED_DAEMON_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE")"
          python3 "${{ github.workspace }}/gee-backend/scripts/validate_image_security_policy.py" validate \
            --policy "${{ github.workspace }}/gee-backend/security/frozen-image-debt.json" \
            --report "${{ github.workspace }}/image-security/backend-trivy.json" \
            --image-role backend \
            --expected-image-ref "$CANDIDATE_IMAGE" \
            --expected-image-id "$EXPECTED_DAEMON_IMAGE_ID" \
            --expected-source-revision "$GITHUB_SHA" \
            --expected-source-repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --repo-root "${{ github.workspace }}"
      - name: Upload backend image evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security-backend
          path: |
            ${{ github.workspace }}/image-security/backend-trivy.json
            ${{ github.workspace }}/image-security/backend-trivy.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload backend image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ github.workspace }}/image-security/backend-trivy.sarif

  image-geo-worker:
    name: Final Geo Worker Image Gate
    runs-on: ubuntu-latest
    # 45 y no 30: el escaneo solo puede tomarse hasta 20m (ver el `timeout` de
    # Trivy mas abajo) y encima esta la construccion de la imagen con GDAL. Con
    # el techo en 30 el job podia morir por reloj del runner justo despues de
    # haberle dado mas margen al escaner, cambiando un fallo confuso por otro.
    timeout-minutes: 45
    needs: [changes, lint, typecheck, test]
    # ~17 minutos (el geo-worker trae GDAL). Solo cuando el diff puede cambiar
    # bytes de imagen (Dockerfile / runtime lock / frozen debt). Un PR de tests
    # no redescubre CVEs de Debian.
    if: ${{ (github.base_ref == 'main' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.backend_image == 'true' }}
    permissions:
      contents: read
      security-events: write
    env:
      CANDIDATE_IMAGE: "local/consorcio-geo-worker:${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build geo-worker candidate image
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}/gee-backend
          file: ${{ github.workspace }}/gee-backend/Dockerfile.geo
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=geo-worker-image
          # BL-GHA-CACHE-CEILING (higiene A, 2026-08-26): mismo razonamiento que
          # el build del backend de arriba — candidato de PR que se escanea y se
          # tira. El productor del scope `geo-worker-image` es deploy.yml, que
          # mantiene `mode=max`. Y esta es la imagen mas cara (GDAL), o sea la
          # que mas blobs escribia por corrida.
          cache-to: type=gha,mode=min,scope=geo-worker-image
      - name: Prepare Geo evidence directory
        working-directory: ${{ github.workspace }}
        run: mkdir -p "${{ github.workspace }}/image-security"
      - name: Generate raw unsuppressed Geo vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          version: v0.70.0
          scanners: vuln
          # El default de Trivy son 5m0s y el analisis del geo-worker no entra:
          # la imagen trae GDAL mas todo el arbol de dependencias de Python.
          # Reventaba con "context deadline exceeded" a los 5 minutos justos,
          # que no es un hallazgo de seguridad sino el reloj interno del
          # escaner. Sin evidencia generada, la politica de imagenes lo
          # reportaba como fallo -correctamente, porque fail-closed- pero el
          # motivo real quedaba enterrado tres pasos mas arriba.
          timeout: '20m'
          format: json
          output: ${{ github.workspace }}/image-security/geo-worker-trivy.json
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Derive Geo SARIF from the raw report
        working-directory: ${{ github.workspace }}
        run: trivy convert --format sarif --output "${{ github.workspace }}/image-security/geo-worker-trivy.sarif" "${{ github.workspace }}/image-security/geo-worker-trivy.json"
      - name: Require an empty Geo finding set
        working-directory: ${{ github.workspace }}
        run: |
          EXPECTED_DAEMON_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE")"
          python3 "${{ github.workspace }}/gee-backend/scripts/validate_image_security_policy.py" validate \
            --policy "${{ github.workspace }}/gee-backend/security/frozen-image-debt.json" \
            --report "${{ github.workspace }}/image-security/geo-worker-trivy.json" \
            --image-role geo-worker \
            --expected-image-ref "$CANDIDATE_IMAGE" \
            --expected-image-id "$EXPECTED_DAEMON_IMAGE_ID" \
            --expected-source-revision "$GITHUB_SHA" \
            --expected-source-repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --repo-root "${{ github.workspace }}"
      - name: Upload Geo image evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security-geo-worker
          path: |
            ${{ github.workspace }}/image-security/geo-worker-trivy.json
            ${{ github.workspace }}/image-security/geo-worker-trivy.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload Geo image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ github.workspace }}/image-security/geo-worker-trivy.sarif

  image-security-policy:
    name: Image Security Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, image-backend, image-geo-worker]
    # `always()` para que un image gate FALLIDO no saltee la politica y de
    # verde falso; pero exige tambien que haya habido cambios de backend,
    # porque el paso de abajo pide `success` y un job SALTEADO no lo es.
    if: ${{ always() && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.backend == 'true' }}
    permissions:
      contents: read
    env:
      IMAGE_BACKEND_RESULT: ${{ needs.image-backend.result }}
      IMAGE_GEO_WORKER_RESULT: ${{ needs.image-geo-worker.result }}
    steps:
      - name: Require both image policy jobs
        working-directory: ${{ github.workspace }}
        run: |
          # Image jobs `needs:` lint/typecheck/test. If lint fails they are
          # skipped, and `always()` still runs this policy. Demanding success
          # then double-fails and hides the audit/lint cause. Both skipped =
          # policy N/A (Backend CI already fails the skipped-upstream job).
          # One skipped + one success/failure is inconsistent — fail closed.
          if [ "$IMAGE_BACKEND_RESULT" = "skipped" ] && [ "$IMAGE_GEO_WORKER_RESULT" = "skipped" ]; then
            echo "image jobs skipped; policy N/A"
            echo "policy_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$IMAGE_BACKEND_RESULT" = "success"
          test "$IMAGE_GEO_WORKER_RESULT" = "success"
          echo "policy_needed=true" >> "$GITHUB_OUTPUT"
        id: gate
      - name: Download image security evidence
        uses: actions/download-artifact@v4
        if: ${{ always() && steps.gate.outputs.policy_needed == 'true' }}
        with:
          pattern: image-security-*
          path: ${{ github.workspace }}/evidence
          merge-multiple: true
      - name: Require every raw and SARIF report
        if: ${{ always() && steps.gate.outputs.policy_needed == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          test -s "${{ github.workspace }}/evidence/backend-trivy.json"
          test -s "${{ github.workspace }}/evidence/backend-trivy.sarif"
          test -s "${{ github.workspace }}/evidence/geo-worker-trivy.json"
          test -s "${{ github.workspace }}/evidence/geo-worker-trivy.sarif"

  ci-gate:
    # EL check requerido de branch protection para este workflow. Registrar en
    # la proteccion de rama el `name` ("Backend CI"), no el id del job.
    #
    # Existe porque los checks individuales no sirven como requeridos: se
    # saltean cuando el PR no toca el backend, y depender de como GitHub
    # interpreta un job salteado es fragil. Este job corre SIEMPRE y reporta
    # una conclusion propia: verde si cada dependencia paso o se salteo,
    # rojo si alguna fallo o fue cancelada.
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, typecheck, test, mutation, security, image-backend, image-geo-worker, image-security-policy]
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      TEST_RESULT: ${{ needs.test.result }}
      MUTATION_RESULT: ${{ needs.mutation.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      IMAGE_BACKEND_RESULT: ${{ needs.image-backend.result }}
      IMAGE_GEO_WORKER_RESULT: ${{ needs.image-geo-worker.result }}
      IMAGE_SECURITY_POLICY_RESULT: ${{ needs.image-security-policy.result }}
    steps:
      - name: Require every backend job to pass or be skipped
        working-directory: ${{ github.workspace }}
        run: |
          # `changes` es la fuente de verdad de todo el resto: si el se cae,
          # los demas se saltean y el gate no puede darse por satisfecho.
          test "$CHANGES_RESULT" = "success"
          require() {
            case "$2" in
              success|skipped) ;;
              *) echo "::error::$1 termino en '$2'"; exit 1 ;;
            esac
          }
