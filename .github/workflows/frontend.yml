name: Frontend

on:
  push:
    # main, not develop: develop no existe (trigger muerto desde el flujo
    # PR→main). Cloudflare Pages publica el frontend desde main en cada push,
    # así que sin esto lo publicado no tenía NINGUNA señal de CI.
    # OJO: en push corren lint + test + typecheck + image; mutation, a11y y
    # build quedan gateados a pull_request/dispatch (ver los `if:` de esos
    # jobs). La cobertura completa sigue siendo la del PR.
    branches: [main]
    paths:
      - 'consorcio-web/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'consorcio-web/**'
      - '.github/workflows/frontend.yml'
  schedule:
    # Lunes 06:00 ART (09:00 UTC) — refresca la baseline incremental de
    # mutación que reusan los PRs. Solo dispara el job `mutation-full`.
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: consorcio-web

jobs:
  lint:
    name: Lint
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run lint

  test:
    name: Test
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run test:run

  typecheck:
    name: Typecheck
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run typecheck

  smoke:
    name: Smoke tests
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run test:smoke

  mutation:
    name: Mutation tests (stryker, incremental)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Incremental: only the mutants this PR's diff can affect. The full scope
    # is 1880 mutants ≈ 46 min on a runner (measured: it hit 1840/1880 at the
    # 45-minute mark), which is too much per PR for a repo that already had to
    # disable a workflow over Actions quota. The weekly `mutation-full` job
    # keeps the baseline fresh; this one stays minutes long.
    timeout-minutes: 25
    needs: [typecheck, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      # Restore the incremental baseline produced by the weekly full run. On a
      # cache miss Stryker just runs everything it can inside the timeout and
      # writes a fresh baseline — degraded, never wrong.
      - name: Restore mutation baseline
        uses: actions/cache@v4
        with:
          path: consorcio-web/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-
      - run: npm run mutation:run

  mutation-full:
    name: Mutation tests (stryker, full baseline)
    # Weekly, not per PR: refreshes the incremental baseline the PR job reuses.
    # ~46 min, so it must never sit on the PR critical path.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Full mutation run (rebuilds the baseline)
        run: npx stryker run --force
      - name: Save mutation baseline
        uses: actions/cache/save@v4
        if: always()
        with:
          path: consorcio-web/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}

  accessibility:
    name: Accessibility matrix (Playwright)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Install locked Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run accessibility matrix
        run: CI=1 npm run test:a11y
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-${{ github.run_id }}
          path: |
            consorcio-web/a11y-report/
            consorcio-web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck, smoke, mutation, accessibility]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run build

  image:
    name: Final Frontend Image Gate
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, typecheck, smoke]
    permissions:
      contents: read
    env:
      CANDIDATE_IMAGE: "local/consorcio-frontend:${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend candidate image
        uses: docker/build-push-action@v5
        with:
          context: consorcio-web
          file: consorcio-web/Dockerfile
          target: runtime
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
      - name: Scan frontend candidate image
        # Pinned to commit SHA of v0.36.0 (peeled tag, verified via git ls-remote)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
