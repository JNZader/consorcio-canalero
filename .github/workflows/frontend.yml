name: Frontend

on:
  push:
    branches: [develop]
    paths:
      - 'consorcio-web/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'consorcio-web/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: consorcio-web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run test:run

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run typecheck

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run test:smoke

  mutation:
    name: Mutation tests (stryker)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run mutation:run

  accessibility:
    name: Accessibility matrix (Playwright)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Install locked Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run accessibility matrix
        run: CI=1 npm run test:a11y
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-${{ github.run_id }}
          path: |
            consorcio-web/a11y-report/
            consorcio-web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck, smoke, mutation, accessibility]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run build

  image:
    name: Final Frontend Image Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, typecheck, smoke]
    permissions:
      contents: read
    env:
      CANDIDATE_IMAGE: "local/consorcio-frontend:${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend candidate image
        uses: docker/build-push-action@v5
        with:
          context: consorcio-web
          file: consorcio-web/Dockerfile
          target: runtime
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
      - name: Scan frontend candidate image
        # Pinned to commit SHA of v0.36.0 (peeled tag, verified via git ls-remote)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
