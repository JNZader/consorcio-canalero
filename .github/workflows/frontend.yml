name: Frontend

on:
  push:
    # main, not develop: develop no existe (trigger muerto desde el flujo
    # PR→main). Cloudflare Pages publica el frontend desde main en cada push,
    # así que sin esto lo publicado no tenía NINGUNA señal de CI.
    # OJO: en push corren lint + test + typecheck + image; mutation, a11y y
    # build quedan gateados a pull_request/dispatch (ver los `if:` de esos
    # jobs). La cobertura completa sigue siendo la del PR.
    branches: [main]
  # SIN filtro `paths:` a proposito: un filtro de paths hace que el workflow
  # entero NO CORRA, y un check requerido que nunca corre deja el PR colgado
  # para siempre en "Expected — waiting for status". El filtrado se mudo
  # adentro, al job `changes`.
  pull_request:
    branches: [main, develop]
  schedule:
    # Lunes y jueves 06:00 ART (09:00 UTC) — refresca la baseline incremental
    # de mutación que reusan los PRs. Solo dispara el job `mutation-full`.
    #
    # DOS veces por semana y no una: GitHub desaloja las cachés que no se usan
    # en 7 días, justo el período de un cron semanal. Con una sola corrida, una
    # semana sin PRs de frontend dejaba caducar la baseline y el PR siguiente
    # pagaba la corrida en frío — que ya midió 62m53s contra un techo de 70.
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

concurrency:
  # Grupo SEPARADO por tipo de disparo. La baseline de mutacion corre por
  # schedule/dispatch en main; los push/PR corren la bateria de CI. Si
  # comparten grupo (con cancel-in-progress), un push a main CANCELA la corrida
  # de baseline en vuelo — que fue exactamente lo que impidio sembrar la
  # baseline en `main` y dejo a cada release pagando el scope completo de
  # Stryker (~40 min). Con grupos distintos, la baseline completa tranquila.
  group: >-
    frontend-${{ github.ref }}-${{
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && 'baseline' || 'ci' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: consorcio-web

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: sin esto el merge-base contra la rama base no
          # existe en el clon y el diff de abajo falla o miente.
          fetch-depth: 0
      - id: detect
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fuera de un pull_request no hay contra que diffear (en el primer
          # push de una rama `before` es todo ceros), asi que se declara todo
          # cambiado: preferimos correr de mas antes que saltear en silencio.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tres puntos = merge-base. Con dos puntos, un avance de la rama base
          # posterior a la apertura del PR aparecerria como cambio del PR.
          CHANGED="$(git diff --name-only "$BASE_SHA...HEAD")"
          if printf '%s\n' "$CHANGED" | grep -qE '^(consorcio-web/|\.github/workflows/)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: [changes]
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run lint

  test:
    name: Test
    needs: [changes]
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      # Con cobertura, no `test:run`: los thresholds de vitest.config.ts
      # (60/60/60/60) solo actuan como gate si el reporter de coverage corre.
      # Con `vitest run` a secas los umbrales estaban declarados pero nunca se
      # evaluaban, asi que una caida de cobertura pasaba el CI en verde.
      - run: npm run test:coverage

  typecheck:
    name: Typecheck
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run typecheck

  smoke:
    name: Smoke tests
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run test:smoke

  mutation:
    name: Mutation tests (stryker, incremental)
    if: ${{ (github.base_ref == 'main' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    # Incremental: only the mutants this PR's diff can affect — minutes once a
    # baseline exists. The full scope is 1880 mutants ≈ 46 min on a runner
    # (measured: 1840/1880 at the 45-minute mark), too much per PR for a repo
    # that already had to disable a workflow over Actions quota.
    #
    # The 70 is a CEILING, not a cost: a cache hit finishes in minutes and
    # bills minutes. It only matters on a COLD cache (no baseline yet, or the
    # weekly entry evicted), where Stryker has to run everything — a 25-minute
    # cap just killed that run mid-flight and failed the PR. Sized like
    # `mutation-full` so the cold path can actually complete and store the
    # baseline the next PRs reuse.
    timeout-minutes: 70
    needs: [changes, typecheck, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      # Restore the incremental baseline produced by the weekly full run.
      # On a cache MISS Stryker runs the whole scope (~46 min) and stores a
      # fresh baseline for the next PRs — hence this job's generous ceiling.
      # `restore-keys` makes any previous baseline usable: Stryker re-tests
      # what the diff touched and trusts the stored verdicts for the rest.
      - name: Restore mutation baseline
        uses: actions/cache@v4
        with:
          path: consorcio-web/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-
      - run: npm run mutation:run

  mutation-full:
    name: Mutation tests (stryker, full baseline)
    # Weekly, not per PR: refreshes the incremental baseline the PR job reuses.
    # ~46 min, so it must never sit on the PR critical path.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Full mutation run (rebuilds the baseline)
        run: npx stryker run --force
      - name: Save mutation baseline
        uses: actions/cache/save@v4
        if: always()
        with:
          path: consorcio-web/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}

  accessibility:
    name: Accessibility matrix (Playwright)
    if: ${{ (github.base_ref == 'main' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, typecheck, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Install locked Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run accessibility matrix
        run: CI=1 npm run test:a11y
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-${{ github.run_id }}
          path: |
            consorcio-web/a11y-report/
            consorcio-web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    # NO depende de `mutation` ni de `accessibility`: un job salteado arrastra
    # al salteo a todo el que lo tenga en `needs`, y desde que esos dos corren
    # solo en el PR de release eso habria apagado el build en cada PR.
    needs: [changes, lint, test, typecheck, smoke]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run build

  image:
    name: Final Frontend Image Gate
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint, test, typecheck, smoke]
    permissions:
      contents: read
    env:
      CANDIDATE_IMAGE: "local/consorcio-frontend:${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend candidate image
        uses: docker/build-push-action@v5
        with:
          context: consorcio-web
          file: consorcio-web/Dockerfile
          target: runtime
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
      - name: Scan frontend candidate image
        # Pinned to commit SHA of v0.36.0 (peeled tag, verified via git ls-remote)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  ci-gate:
    # EL check requerido de branch protection para este workflow. Registrar en
    # la proteccion de rama el `name` ("Frontend CI"), no el id del job.
    #
    # Existe porque los checks individuales no sirven como requeridos: se
    # saltean cuando el PR no toca el frontend, y depender de como GitHub
    # interpreta un job salteado es fragil. Este job corre SIEMPRE y reporta
    # una conclusion propia: verde si cada dependencia paso o se salteo,
    # rojo si alguna fallo o fue cancelada.
    #
    # `mutation-full` queda AFUERA a proposito: es del cron semanal y no del
    # PR. Contrapartida asumida: si esa corrida se rompe, ningun check
    # requerido lo refleja — hay que mirar la pestana de Actions.
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, test, typecheck, smoke, mutation, accessibility, build, image]
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TEST_RESULT: ${{ needs.test.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      MUTATION_RESULT: ${{ needs.mutation.result }}
      ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Require every frontend job to pass or be skipped
        working-directory: ${{ github.workspace }}
        run: |
          # `changes` es la fuente de verdad de todo el resto: si el se cae,
          # los demas se saltean y el gate no puede darse por satisfecho.
          test "$CHANGES_RESULT" = "success"
          require() {
            case "$2" in
              success|skipped) ;;
              *) echo "::error::$1 termino en '$2'"; exit 1 ;;
            esac
          }
          require lint "$LINT_RESULT"
          require test "$TEST_RESULT"
          require typecheck "$TYPECHECK_RESULT"
          require smoke "$SMOKE_RESULT"
          require mutation "$MUTATION_RESULT"
          require accessibility "$ACCESSIBILITY_RESULT"
          require build "$BUILD_RESULT"
          require image "$IMAGE_RESULT"
