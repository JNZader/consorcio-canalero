name: Frontend

on:
  push:
    # main, not develop: develop no existe (trigger muerto desde el flujo
    # PR→main). Cloudflare Pages publica el frontend desde main en cada push,
    # así que sin esto lo publicado no tenía NINGUNA señal de CI.
    # OJO: en push corren lint + test + typecheck + image; mutation queda
    # gateado al PR de release, mientras a11y y build corren en PR/dispatch
    # (ver los `if:` de esos jobs). La cobertura completa sigue siendo la del PR.
    branches: [main]
  # SIN filtro `paths:` a proposito: un filtro de paths hace que el workflow
  # entero NO CORRA, y un check requerido que nunca corre deja el PR colgado
  # para siempre en "Expected — waiting for status". El filtrado se mudo
  # adentro, al job `changes`.
  pull_request:
    branches: [main, develop]
  schedule:
    # Lunes y jueves 06:00 ART (09:00 UTC) — refresca la baseline incremental
    # de mutación que reusan los PRs. Solo dispara el job `mutation-full`.
    #
    # DOS veces por semana y no una: GitHub desaloja las cachés que no se usan
    # en 7 días, justo el período de un cron semanal. Con una sola corrida, una
    # semana sin PRs de frontend dejaba caducar la baseline y el PR siguiente
    # pagaba la corrida en frio. El scope actual es de 3049 mutantes y una
    # corrida alojada ya agoto 120 minutos sin terminar.
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

concurrency:
  # Grupo SEPARADO por tipo de disparo. La baseline de mutacion corre por
  # schedule/dispatch en main; los push/PR corren la bateria de CI. Si
  # comparten grupo (con cancel-in-progress), un push a main CANCELA la corrida
  # de baseline en vuelo — que fue exactamente lo que impidio sembrar la
  # baseline en `main` y dejo a cada release pagando el scope completo de
  # Stryker (hoy 3049 mutantes; hasta 120 min alojados). Con grupos distintos,
  # la baseline completa tranquila.
  group: >-
    frontend-${{ github.ref }}-${{
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && 'baseline' || 'ci' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: consorcio-web

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: sin esto el merge-base contra la rama base no
          # existe en el clon y el diff de abajo falla o miente.
          fetch-depth: 0
      - id: detect
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fuera de un pull_request no hay contra que diffear (en el primer
          # push de una rama `before` es todo ceros), asi que se declara todo
          # cambiado: preferimos correr de mas antes que saltear en silencio.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tres puntos = merge-base. Con dos puntos, un avance de la rama base
          # posterior a la apertura del PR aparecerria como cambio del PR.
          CHANGED="$(git diff --name-only "$BASE_SHA...HEAD")"
          if printf '%s\n' "$CHANGED" | grep -qE '^(consorcio-web/|\.github/workflows/)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: [changes]
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run lint

  test:
    name: Test
    needs: [changes]
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      # Con cobertura, no `test:run`: los thresholds de vitest.config.ts
      # (60/60/60/60) solo actuan como gate si el reporter de coverage corre.
      # Con `vitest run` a secas los umbrales estaban declarados pero nunca se
      # evaluaban, asi que una caida de cobertura pasaba el CI en verde.
      - run: npm run test:coverage

  typecheck:
    name: Typecheck
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run typecheck

  smoke:
    name: Smoke tests
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run test:smoke

  mutation:
    name: Mutation tests (stryker, incremental, shard ${{ matrix.shard }})
    # workflow_dispatch pertenece exclusivamente al productor de baseline de
    # abajo: si entrara aca tambien, lanzaria dos Stryker completos en paralelo.
    if: ${{ github.base_ref == 'main' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    # 90 -> 120. El peor caso de este job NO es la corrida incremental: es la
    # corrida completa que queda cuando la baseline no aparece. Medido: el shard
    # `a` completo tarda 81m30s en `mutation-full` (run 32710461062, 2026-08-24)
    # y el PR #242 murio a los 90 min EN EL 96% (1558/1565 mutantes, ~2 min de
    # cola) — no por lentitud nueva, sino porque el techo estaba 2 minutos por
    # debajo del numero real. Con 120 el fallback en frio termina en verde y el
    # gate sigue midiendo; sin el, el gate se cae por reloj y no mide nada.
    timeout-minutes: 120
    needs: [changes, typecheck, smoke]
    permissions:
      contents: read
      # Para que el paso de rescate de baseline pueda leer los artifacts de la
      # ultima corrida de `mutation-full`.
      actions: read
    strategy:
      fail-fast: false
      # Measured PR #249 evidence shows authStore dominates elapsed time. Its
      # 238/239 boundary has no spanning mutants, so two contiguous ranges keep
      # every mutant in exactly one shard. The full baseline matrix is identical.
      matrix:
        include:
          - shard: auth1
            mutate: src/stores/authStore.ts:1-238
          - shard: auth2
            mutate: src/stores/authStore.ts:239-324
          - shard: a
            mutate: src/components/map2d/rainfall/rainfallFormat.ts,src/lib/formatters.ts,src/hooks/useRainfallAnalysis.ts,src/stores/configStore.ts,src/lib/auth.ts,src/components/map2d/bpaPracticas.ts,src/components/map2d/canalesFormat.ts
          - shard: b
            mutate: src/components/map2d/rainfall/RainfallMetricList.tsx,src/components/map2d/rainfall/RainfallDetailPanel.tsx,src/lib/api/core.ts,src/lib/validators.ts,src/lib/typeGuards.ts,src/lib/errorHandler.ts,src/components/admin/pilarVerdeWidget/fmt.ts,src/components/admin/pilarVerdeWidget/computeKpis.ts,src/lib/api/rainfall.ts
    env:
      STRYKER_SHARD: ${{ matrix.shard }}
      MUTATE: ${{ matrix.mutate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Restore shard mutation baseline
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: consorcio-web/reports/mutation/stryker-incremental-${{ matrix.shard }}.json
          key: stryker-incremental-v2-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-v2-${{ matrix.shard }}-
      # INCIDENTE PR #242 (2026-08-26): "Cache not found for input keys:
      # stryker-incremental-v2-a-<sha>, stryker-incremental-v2-a-". El cron del
      # 2026-08-24 SI habia publicado la baseline (run 32710461062, job
      # `Publish full mutation baselines` en verde) — la caché desaparecio en
      # menos de 48 h. La causa no es la caducidad por 7 dias sin uso que
      # documenta el `schedule` de arriba, es el techo DURO de 10 GB por repo:
      # medido ese mismo dia, 12.1 GB en 259 entradas y CERO entradas stryker.
      # Los `cache-to: type=gha,mode=max` de las imagenes escriben blobs de
      # 300-400 MB por corrida y el LRU se come las baselines de ~1 MB antes
      # que nada. Desde la higiene A (2026-08-26) solo quedan DOS, los dos de
      # `deploy.yml`; los candidatos de PR (frontend, backend, geo-worker)
      # pasaron a `mode=min`.
      #
      # La caché entonces no es un almacen del que uno pueda depender; el
      # artifact SI (14 dias de retencion, fuera del LRU). Este paso lo usa como
      # respaldo. Si tampoco aparece, avisa y deja correr el scope completo: el
      # gate NUNCA se ablanda por no encontrar la baseline, solo tarda mas.
      - name: Recover the baseline from the last published artifact
        if: steps.baseline-cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p reports/mutation
          for event in schedule workflow_dispatch; do
            for run_id in $(gh run list --workflow frontend.yml --branch main \
                --event "$event" --status success --limit 8 \
                --json databaseId --jq '.[].databaseId'); do
              if gh run download "$run_id" \
                  --name "mutation-full-${SHARD}-${run_id}" \
                  --dir reports/mutation 2>/dev/null; then
                echo "Baseline for shard ${SHARD} recovered from run ${run_id} (${event})."
                exit 0
              fi
            done
          done
          echo "::warning::No published baseline artifact for shard ${SHARD}; running the full scope cold."
      - name: Restrict incremental baseline to this shard scope
        # Stryker intentionally retains out-of-scope baseline mutants. Without
        # this fail-closed filter, moved/ranged mutants leak into multiple shard
        # reports and can duplicate or bypass the global score gate.
        run: >-
          python3 scripts/filter_stryker_incremental.py --mutate "$MUTATE"
          "reports/mutation/stryker-incremental-${STRYKER_SHARD}.json"
      - run: npm run mutation:run -- --mutate "$MUTATE"
      - name: Upload shard mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-pr-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            consorcio-web/reports/mutation/mutation-${{ matrix.shard }}.json
            consorcio-web/reports/mutation/stryker-incremental-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  mutation-gate:
    name: Mutation score gate
    needs: [changes, mutation]
    if: ${{ always() && github.base_ref == 'main' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MUTATION_RESULT: ${{ needs.mutation.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Require all mutation shards
        working-directory: ${{ github.workspace }}
        run: test "$MUTATION_RESULT" = "success"
      - name: Download shard mutation reports
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-pr-*
          path: consorcio-web/reports/mutation
          merge-multiple: true
      - name: Enforce the global mutation threshold
        run: |
          EXPECTED_SOURCES="$(node --input-type=module -e "import { mutationTargets } from './stryker.config.mjs'; process.stdout.write(mutationTargets.join(','))")"
          python3 scripts/aggregate_stryker_reports.py --minimum 75 \
            --expected-source "$EXPECTED_SOURCES" \
            --ranged-source src/stores/authStore.ts \
            reports/mutation/mutation-auth1.json reports/mutation/mutation-auth2.json \
            reports/mutation/mutation-a.json reports/mutation/mutation-b.json

  mutation-full:
    name: Mutation tests (stryker, full baseline, shard ${{ matrix.shard }})
    # Scheduled/manual, not per PR: refreshes the incremental baseline the PR
    # job reuses. A dispatch is restricted to main so the saved cache lives in
    # refs/heads/main and is readable by release PRs; scheduled runs already
    # execute from the default branch. Dispatch launches this Stryker job only.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    # 90 -> 120, por el mismo margen que el job incremental: el shard `a` ya
    # tarda 81m30s (run 32710461062). Este job SIEMPRE corre el scope completo,
    # asi que era el que estaba mas cerca del techo. Si se cae por reloj no se
    # publica baseline, y sin baseline cada PR paga la corrida en frio.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: auth1
            mutate: src/stores/authStore.ts:1-238
          - shard: auth2
            mutate: src/stores/authStore.ts:239-324
          - shard: a
            mutate: src/components/map2d/rainfall/rainfallFormat.ts,src/lib/formatters.ts,src/hooks/useRainfallAnalysis.ts,src/stores/configStore.ts,src/lib/auth.ts,src/components/map2d/bpaPracticas.ts,src/components/map2d/canalesFormat.ts
          - shard: b
            mutate: src/components/map2d/rainfall/RainfallMetricList.tsx,src/components/map2d/rainfall/RainfallDetailPanel.tsx,src/lib/api/core.ts,src/lib/validators.ts,src/lib/typeGuards.ts,src/lib/errorHandler.ts,src/components/admin/pilarVerdeWidget/fmt.ts,src/components/admin/pilarVerdeWidget/computeKpis.ts,src/lib/api/rainfall.ts
    env:
      STRYKER_SHARD: ${{ matrix.shard }}
      MUTATE: ${{ matrix.mutate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Full mutation run (rebuilds the baseline)
        run: npm run mutation:run -- --force --mutate "$MUTATE"
      - name: Upload full shard mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-full-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            consorcio-web/reports/mutation/mutation-${{ matrix.shard }}.json
            consorcio-web/reports/mutation/stryker-incremental-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  mutation-full-publish:
    name: Publish full mutation baselines
    needs: [mutation-full]
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MUTATION_FULL_RESULT: ${{ needs.mutation-full.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Require all full mutation shards
        working-directory: ${{ github.workspace }}
        run: test "$MUTATION_FULL_RESULT" = "success"
      - name: Download full shard mutation reports
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-full-*
          path: consorcio-web/reports/mutation
          merge-multiple: true
      - name: Enforce the global mutation threshold
        run: |
          EXPECTED_SOURCES="$(node --input-type=module -e "import { mutationTargets } from './stryker.config.mjs'; process.stdout.write(mutationTargets.join(','))")"
          python3 scripts/aggregate_stryker_reports.py --minimum 75 \
            --expected-source "$EXPECTED_SOURCES" \
            --ranged-source src/stores/authStore.ts \
            reports/mutation/mutation-auth1.json reports/mutation/mutation-auth2.json \
            reports/mutation/mutation-a.json reports/mutation/mutation-b.json
      - name: Save mutation baseline for shard auth1
        uses: actions/cache/save@v4
        with:
          path: consorcio-web/reports/mutation/stryker-incremental-auth1.json
          key: stryker-incremental-v2-auth1-${{ github.sha }}
      - name: Save mutation baseline for shard auth2
        uses: actions/cache/save@v4
        with:
          path: consorcio-web/reports/mutation/stryker-incremental-auth2.json
          key: stryker-incremental-v2-auth2-${{ github.sha }}
      - name: Save mutation baseline for shard a
        uses: actions/cache/save@v4
        with:
          path: consorcio-web/reports/mutation/stryker-incremental-a.json
          key: stryker-incremental-v2-a-${{ github.sha }}
      - name: Save mutation baseline for shard b
        uses: actions/cache/save@v4
        with:
          path: consorcio-web/reports/mutation/stryker-incremental-b.json
          key: stryker-incremental-v2-b-${{ github.sha }}

  accessibility:
    name: Accessibility matrix (Playwright)
    if: ${{ (github.base_ref == 'main' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, typecheck, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Install locked Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run accessibility matrix
        run: CI=1 npm run test:a11y
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-${{ github.run_id }}
          path: |
            consorcio-web/a11y-report/
            consorcio-web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    # NO depende de `mutation` ni de `accessibility`: un job salteado arrastra
    # al salteo a todo el que lo tenga en `needs`, y desde que esos dos corren
    # solo en el PR de release eso habria apagado el build en cada PR.
    needs: [changes, lint, test, typecheck, smoke]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run build

  image:
    name: Final Frontend Image Gate
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint, test, typecheck, smoke]
    permissions:
      contents: read
    env:
      CANDIDATE_IMAGE: "local/consorcio-frontend:${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend candidate image
        uses: docker/build-push-action@v5
        with:
          context: consorcio-web
          file: consorcio-web/Dockerfile
          target: runtime
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=frontend-image
          # BL-GHA-CACHE-CEILING (higiene A, 2026-08-26): `mode=max` aca escribia
          # TODAS las capas intermedias — 300-400 MB por corrida — contra el techo
          # DURO de 10 GB del repo (medido: 12.1 GB en 259 entradas). El LRU se
          # comia las baselines de Stryker de ~1 MB en menos de 48 h, que es el
          # incidente del PR #242. Esta imagen es un GATE: se construye, se
          # escanea y se tira, no la consume ninguna corrida posterior — asi que
          # publicar sus capas intermedias solo compraba desalojos. `mode=min`
          # sigue sembrando la capa final, que es lo unico que el `cache-from`
          # de la proxima corrida puede reusar de verdad.
          #
          # CONSECUENCIA ACEPTADA, dicha y no sugerida: el scope
          # `frontend-image` YA NO TIENE ningun productor `mode=max` en todo el
          # repo (`deploy.yml` solo publica backend y geo-worker). O sea que el
          # `cache-from` de arriba solo va a encontrar la capa final, y las
          # etapas intermedias del build se rehacen en cada corrida. Es tiempo
          # de build a cambio de no desalojar las baselines: se elige a
          # proposito. Si algun dia el frontend necesita cache intermedia de
          # verdad, el lugar es un productor en `deploy.yml` (main), no este
          # candidato desechable.
          cache-to: type=gha,mode=min,scope=frontend-image
      - name: Scan frontend candidate image
        # Pinned to commit SHA of v0.36.0 (peeled tag, verified via git ls-remote)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  ci-gate:
    # EL check requerido de branch protection para este workflow. Registrar en
    # la proteccion de rama el `name` ("Frontend CI"), no el id del job.
    #
    # Existe porque los checks individuales no sirven como requeridos: se
    # saltean cuando el PR no toca el frontend, y depender de como GitHub
    # interpreta un job salteado es fragil. Este job corre SIEMPRE y reporta
    # una conclusion propia: verde si cada dependencia paso o se salteo,
    # rojo si alguna fallo o fue cancelada.
    #
    # `mutation-full` queda AFUERA a proposito: produce la baseline por cron o
    # dispatch y no es parte del PR. Contrapartida asumida: si se rompe, ningun
    # check requerido lo refleja — hay que mirar la pestana de Actions.
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, test, typecheck, smoke, mutation, mutation-gate, accessibility, build, image]
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TEST_RESULT: ${{ needs.test.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      MUTATION_RESULT: ${{ needs.mutation.result }}
      MUTATION_GATE_RESULT: ${{ needs.mutation-gate.result }}
      FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
      BASE_REF: ${{ github.base_ref }}
      ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Require every frontend job to pass or be skipped
        working-directory: ${{ github.workspace }}
        run: |
          # `changes` es la fuente de verdad de todo el resto: si el se cae,
          # los demas se saltean y el gate no puede darse por satisfecho.
          test "$CHANGES_RESULT" = "success"
          require() {
            case "$2" in
              success|skipped) ;;
              *) echo "::error::$1 termino en '$2'"; exit 1 ;;
            esac
          }
          require lint "$LINT_RESULT"
          require test "$TEST_RESULT"
          require typecheck "$TYPECHECK_RESULT"
          require smoke "$SMOKE_RESULT"
          # En un PR de frontend a main, ambos jobs de mutacion son obligatorios:
          # `skipped` no es exito. Fuera de ese caso se preserva la semantica
          # historica del gate para jobs no aplicables.
          if [ "$BASE_REF" = "main" ] && [ "$FRONTEND_CHANGED" = "true" ]; then
            test "$MUTATION_RESULT" = "success"
            test "$MUTATION_GATE_RESULT" = "success"
          fi
          require mutation "$MUTATION_RESULT"
          require mutation-gate "$MUTATION_GATE_RESULT"
          require accessibility "$ACCESSIBILITY_RESULT"
          require build "$BUILD_RESULT"
          require image "$IMAGE_RESULT"
