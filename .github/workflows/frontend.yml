name: Frontend

on:
  push:
    branches: [develop]
    paths:
      - 'consorcio-web/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'consorcio-web/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: consorcio-web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run test:run

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run typecheck

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run test:smoke

  mutation:
    name: Mutation tests (stryker)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run mutation:run

  build:
    name: Build
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck, smoke, mutation]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consorcio-web/package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
