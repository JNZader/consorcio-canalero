name: Build and Publish Images

on:
  push:
    branches: [main]
    paths:
      - 'gee-backend/**'
      - '.github/workflows/deploy.yml'

# Frontend: Cloudflare Pages buildea y deployea automaticamente desde este repo.
# Este workflow solo buildea y publica las imagenes Docker del backend y geo-worker.

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  GEO_WORKER_IMAGE: ${{ github.repository }}/geo-worker

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality-backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: gee-backend
    services:
      # Phase 4 / F4-A: real PostGIS so the full ``tests/new/`` suite
      # runs in CI with the coverage gate. testcontainers can't spin
      # Docker-in-Docker on the default runner; using GH services
      # gets us the same image with zero local plumbing.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_consorcio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_consorcio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_consorcio
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gee-backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app/auth app/domains/padron app/domains/denuncias  # mypy.ini strict scope
      - name: Run release contract and security tests
        run: >-
          python3 -m pytest
          tests/test_ci_workflow_contracts.py
          tests/test_tramites_schema.py
          tests/new/test_admin_frontend_contracts.py
          tests/new/test_auth_gates.py
          tests/new/test_gee_public_contract.py
          tests/new/test_production_security_config.py
          -q --no-header --tb=short
      # Phase 4 / F4-A: backend coverage gate at 60% on the full
      # ``tests/new/`` suite. The .coveragerc omits the geo-worker
      # modules (composites / processing / tile_service /
      # water_detection / gee_service*) — they live in the geo-worker
      # container with GDAL + WhiteboxTools + Earth Engine the backend
      # CI does NOT have, so their tests skip here. Local measurement
      # at the time of landing this gate: 65.9% on the non-skipped
      # surface; the 60% floor gives us a regression cushion.
      - run: python3 -m pytest tests/new/ --cov=app --cov-config=.coveragerc --cov-report=term --cov-fail-under=60 -q --no-header --tb=short

  mutation-backend:
    name: Backend mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [quality-backend]
    defaults:
      run:
        working-directory: gee-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gee-backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 scripts/cosmic_gate.py --min-kill-rate 0.30

  security-backend:
    name: Backend security gate (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality-backend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Pinned to commit SHA of v0.36.0 (peeled tag, verified via git ls-remote)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: gee-backend
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-backend, mutation-backend, security-backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: gee-backend
          file: gee-backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary — image SHA + rollback hint
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${SHORT_SHA}"
          {
            echo "### Backend image published"
            echo ""
            echo "\`\`\`"
            echo "$IMAGE"
            echo "\`\`\`"
            echo ""
            echo "**To deploy this build on the Hetzner server:**"
            echo ""
            echo "1. Edit \`/home/javier/stacks/consorcio/.env\`:"
            echo "   \`BACKEND_IMAGE=$IMAGE\`"
            echo "2. Run: \`docker compose pull backend && docker compose up -d backend\`"
            echo ""
            echo "**To rollback** to a previous version, point BACKEND_IMAGE at the older SHA from"
            echo "[the package registry](https://github.com/${{ github.repository }}/pkgs/container/consorcio-canalero%2Fbackend)."
          } >> "$GITHUB_STEP_SUMMARY"

  build-geo-worker:
    name: Build Geo Worker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality-backend, mutation-backend, security-backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.GEO_WORKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: gee-backend
          file: gee-backend/Dockerfile.geo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary — geo-worker image SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ env.GEO_WORKER_IMAGE }}:${SHORT_SHA}"
          {
            echo "### Geo-worker image published"
            echo ""
            echo "\`\`\`"
            echo "$IMAGE"
            echo "\`\`\`"
            echo ""
            echo "Set \`GEO_WORKER_IMAGE=$IMAGE\` in the server .env then"
            echo "\`docker compose pull geo-worker && docker compose up -d geo-worker\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-backend, build-geo-worker]
    # Production rollout is opt-in even when a webhook URL exists.
    if: ${{ vars.ENABLE_PRODUCTION_DEPLOY == 'true' && vars.DEPLOY_WEBHOOK_URL != '' }}
    steps:
      - name: Trigger redeploy via webhook
        run: |
          curl -X POST "${{ vars.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            --fail --silent --show-error
