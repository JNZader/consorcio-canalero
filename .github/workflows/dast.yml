name: DAST Baseline (OWASP ZAP)

# On-demand passive DAST baseline scan against deployed Cloudflare Pages or Hetzner API/tiles.
# Runs ONLY via workflow_dispatch (never automatically on PRs or pushes) and enforces an explicit
# target allowlist + pinned ZAP digest so it remains non-destructive and reproducible.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Target production URL to scan passively
        type: choice
        required: true
        default: https://consorcio-canalero.pages.dev
        options:
          - https://consorcio-canalero.pages.dev
          - https://cc10demayo-api.javierzader.com
          - https://cc10demayo-tiles.javierzader.com
      preview_url:
        description: Optional Cloudflare Pages preview URL (*.consorcio-canalero.pages.dev)
        type: string
        required: false
        default: ''
      fail_on_warn:
        description: Fail workflow even when ZAP only emits WARN findings
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: dast-baseline
  cancel-in-progress: false

jobs:
  zap-baseline:
    name: OWASP ZAP Passive Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate target allowlist
        id: target
        env:
          TARGET_URL: ${{ inputs.target_url }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          effective="${PREVIEW_URL:-$TARGET_URL}"
          if ! printf '%s' "$effective" | grep -Eq '^(https://consorcio-canalero\.pages\.dev(/.*)?|https://[a-z0-9-]+\.consorcio-canalero\.pages\.dev(/.*)?|https://cc10demayo-api\.javierzader\.com(/.*)?|https://cc10demayo-tiles\.javierzader\.com(/.*)?)$'; then
            echo "Refusing unallowlisted DAST target: $effective" >&2
            exit 1
          fi
          printf 'url=%s\n' "$effective" >> "$GITHUB_OUTPUT"

      - name: Run OWASP ZAP passive baseline scan
        env:
          DAST_TARGET: ${{ steps.target.outputs.url }}
          FAIL_ON_WARN: ${{ inputs.fail_on_warn }}
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/zap-reports"
          cp "${{ github.workspace }}/.zap/rules.tsv" "${{ github.workspace }}/zap-reports/rules.tsv"
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py \
            -t "$DAST_TARGET" \
            -c rules.tsv \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -m 3
          rc=$?
          set -e
          rm -f "${{ github.workspace }}/zap-reports/rules.tsv"
          # ZAP baseline exit codes: 0 = pass, 2 = warnings only, 1/3 = failures.
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 2 ] && [ "$FAIL_ON_WARN" != "true" ]; then
            echo "ZAP passive scan completed with WARN findings (fail_on_warn=false)."
            exit 0
          fi
          echo "ZAP baseline exited with code $rc" >&2
          exit "$rc"

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-zap-baseline
          path: ${{ github.workspace }}/zap-reports/
          if-no-files-found: warn
          retention-days: 30
