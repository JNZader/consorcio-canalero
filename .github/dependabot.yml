# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Majors for MapLibre / Mantine / Vite / Vitest / Biome / SQLAlchemy are
# deferred to explicit Wave C PRs — Dependabot stays on minor/patch only.

version: 2

updates:
  # ============================================
  # GitHub Actions - Workflow dependencies
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ============================================
  # Python/pip - Backend dependencies
  # ============================================
  - package-ecosystem: "pip"
    directory: "/gee-backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    labels:
      - "dependencies"
      - "python"
      - "backend"
      - "automated"
    reviewers:
      - "maintainers"
    ignore:
      # Majors reviewed manually (Wave C for SQLAlchemy / psycopg)
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "alembic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "psycopg2*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "psycopg*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "earthengine-api"
        update-types: ["version-update:semver-major"]
    groups:
      # FastAPI ecosystem
      fastapi-ecosystem:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "starlette*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"
      # Google/GEE related
      google-gee:
        patterns:
          - "google-*"
          - "earthengine-*"
        update-types:
          - "minor"
          - "patch"
      # Async and task queue
      async-tasks:
        patterns:
          - "celery*"
          - "redis*"
          - "httpx*"
        update-types:
          - "minor"
          - "patch"
      # Security and auth
      security-auth:
        patterns:
          - "python-jose*"
          - "cryptography*"
        update-types:
          - "minor"
          - "patch"
      # Database and storage
      database:
        patterns:
          - "sqlalchemy*"
          - "alembic*"
          - "psycopg*"
        update-types:
          - "minor"
          - "patch"
      # Geospatial
      geospatial:
        patterns:
          - "geojson*"
          - "shapely*"
          - "geopandas*"
        update-types:
          - "minor"
          - "patch"
      # Development tools
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
        update-types:
          - "minor"
          - "patch"

  # ============================================
  # npm - Frontend dependencies
  # ============================================
  - package-ecosystem: "npm"
    directory: "/consorcio-web"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
      - "automated"
    reviewers:
      - "maintainers"
    versioning-strategy: increase
    ignore:
      # Core frameworks + Wave C majors (explicit upgrade PRs)
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@biomejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stryker-mutator/*"
        update-types: ["version-update:semver-major"]
    groups:
      # React ecosystem
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      # Mantine UI components
      mantine-ui:
        patterns:
          - "@mantine/*"
        update-types:
          - "minor"
          - "patch"
      # Mapping (MapLibre / PMTiles / Turf)
      mapping:
        patterns:
          - "maplibre-gl"
          - "pmtiles"
          - "@turf/*"
        update-types:
          - "minor"
          - "patch"
      # Icons
      icons:
        patterns:
          - "@tabler/icons-*"
        update-types:
          - "minor"
          - "patch"
      # Development and build tools
      dev-build-tools:
        patterns:
          - "@biomejs/*"
          - "typescript*"
          - "vite*"
          - "vitest*"
          - "@vitest/*"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      # Type definitions
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"

  # ============================================
  # Docker - Container base images
  # ============================================
  - package-ecosystem: "docker"
    directory: "/gee-backend"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/consorcio-web"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
