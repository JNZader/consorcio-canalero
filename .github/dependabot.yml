# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# One weekly PR per ecosystem for minor+patch, and a separate PR for majors.
# github-actions and docker only accept cooldown.default-days.
# The python image ignores 3.15+ with a Bundler requirement (">= 3.15.a").
# Globs and full tags are not valid docker ignore versions. ">= 3.15" misses
# 3.15.0rc* because those sort below 3.15 (#512). ipython majors are ignored
# (#523); their minors and patches still group.

version: 2

updates:
  # ============================================
  # GitHub Actions - Workflow dependencies
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08. github-actions only accepts cooldown.default-days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ============================================
  # Python/pip - Backend dependencies
  # ============================================
  - package-ecosystem: "pip"
    directory: "/gee-backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08: don't apply a release the day it is published.
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(backend)"
    labels:
      - "dependencies"
      - "python"
      - "backend"
      - "automated"
    ignore:
      # #523. ipython 9 was the major over the old 8.x floor; the lock is
      # already on 9.17.1. Further majors stay out of the weekly group.
      - dependency-name: "ipython"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      pip-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ============================================
  # npm - Frontend dependencies
  # ============================================
  - package-ecosystem: "npm"
    directory: "/consorcio-web"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08: don't apply a release the day it is published.
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
      - "automated"
    versioning-strategy: increase
    ignore:
      # @vitejs/plugin-react@6.1.2 (latest) peerOptional is
      # oxc-transform-react@^0.152.0, which is <0.153.0. 0.154 makes
      # `npm ci` fail with ERESOLVE. Drop this once the plugin accepts >=0.154.
      - dependency-name: "oxc-transform-react"
        versions: [">=0.153.0"]
      # Alias of the JS compiler API that Stryker's sandbox preprocessor
      # imports. TypeScript 7 does not export that API; 6.0.3 does.
      # `typescript` itself stays on 7.x for tsc.
      - dependency-name: "typescript-for-stryker"
        versions: [">=7.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ============================================
  # Docker - Container base images
  # ============================================
  - package-ecosystem: "docker"
    directory: "/gee-backend"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08. docker only accepts cooldown.default-days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    ignore:
      # Docker `versions` only accepts Bundler requirements. "*rc*" and
      # "3.15.0rc2-slim-trixie" fail the config check. ">= 3.15" is valid but
      # does not match 3.15.0rc* (they sort below 3.15). ">= 3.15.a" is the
      # lower bound Dependabot itself emits for a semver-minor ignore: it
      # matches 3.15.0rc1/rc2/rc3 and 3.15.0+ and leaves 3.14.x patches.
      # 3.14 stays pinned by hand.
      - dependency-name: "python"
        versions: [">= 3.15.a"]
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "docker"
    directory: "/consorcio-web"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08. docker only accepts cooldown.default-days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
