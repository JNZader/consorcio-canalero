# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# One weekly PR per ecosystem for minor+patch, and a separate PR for majors.
# github-actions and docker only accept cooldown.default-days.
# Python image pre-releases and the 3.15.0-slim-trixie tag are ignored:
# Dependabot classified 3.14.7 → 3.15.0rc2 as an in-line bump (#512).
# ipython majors are ignored (#523); minors and patches still group.

version: 2

updates:
  # ============================================
  # GitHub Actions - Workflow dependencies
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08. github-actions only accepts cooldown.default-days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ============================================
  # Python/pip - Backend dependencies
  # ============================================
  - package-ecosystem: "pip"
    directory: "/gee-backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08: don't apply a release the day it is published.
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(backend)"
    labels:
      - "dependencies"
      - "python"
      - "backend"
      - "automated"
    ignore:
      # #523. ipython 9 was the major over the old 8.x floor; the lock is
      # already on 9.17.1. Further majors stay out of the weekly group.
      - dependency-name: "ipython"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      pip-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ============================================
  # npm - Frontend dependencies
  # ============================================
  - package-ecosystem: "npm"
    directory: "/consorcio-web"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08: don't apply a release the day it is published.
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
      - "automated"
    versioning-strategy: increase
    ignore:
      # @vitejs/plugin-react@6.1.2 (latest) peerOptional is
      # oxc-transform-react@^0.152.0, which is <0.153.0. 0.154 makes
      # `npm ci` fail with ERESOLVE. Drop this once the plugin accepts >=0.154.
      - dependency-name: "oxc-transform-react"
        versions: [">=0.153.0"]
      # Alias of the JS compiler API that Stryker's sandbox preprocessor
      # imports. TypeScript 7 does not export that API; 6.0.3 does.
      # `typescript` itself stays on 7.x for tsc.
      - dependency-name: "typescript-for-stryker"
        versions: [">=7.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ============================================
  # Docker - Container base images
  # ============================================
  - package-ecosystem: "docker"
    directory: "/gee-backend"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08. docker only accepts cooldown.default-days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    ignore:
      # #512 opened 3.15.0rc2 inside the minor/patch group. Wildcards cover
      # later pre-release tags. The explicit list is the 3.15 set from #523,
      # including the stable 3.15.0-slim-trixie tag (the wildcards do not
      # match it: there is no rc/alpha/beta in that string).
      - dependency-name: "python"
        versions:
          - "*rc*"
          - "*alpha*"
          - "*beta*"
          - "*preview*"
          - "*0a*"
          - "*0b*"
          - "3.15.0rc1-slim-trixie"
          - "3.15.0rc2-slim-trixie"
          - "3.15.0rc3-slim-trixie"
          - "3.15.0-slim-trixie"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "docker"
    directory: "/consorcio-web"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    # SEC-08. docker only accepts cooldown.default-days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
