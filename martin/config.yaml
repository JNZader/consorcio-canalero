# Martin Vector Tile Server - Consorcio Canalero
# Docs: https://maplibre.org/martin/

listen_addresses: '0.0.0.0:3000'

postgres:
  # Sourced from the env_file gee-backend/.env so credential rotations stay
  # in one place. Martin v0.14.2 supports ${VAR} interpolation in config.
  connection_string: ${DATABASE_URL}

  # Auto-discover all tables and views with geometry columns
  auto_publish:
    tables:
      from: public
      # Martin will discover both raw tables and vt_ views
    functions: false
