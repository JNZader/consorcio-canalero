# Martin Vector Tile Server - Consorcio Canalero (Produccion)
# Docs: https://maplibre.org/martin/
#
# La variable ${DATABASE_URL} la inyecta el docker-compose (desde .env → MARTIN_DB_URL).
# Martin expande ${DATABASE_URL} internamente al leer el config.
#
# IMPORTANTE — Caddy debe usar handle_path (NO handle) para el prefix /tiles:
#
#   consorcio.DOMINIO {
#     handle_path /tiles/* {          ← strips /tiles antes de forwarding a Martin
#       reverse_proxy consorcio-martin:3000
#     }
#     handle /api/* {
#       reverse_proxy consorcio-backend:8000
#     }
#     handle {
#       reverse_proxy consorcio-frontend:80
#     }
#   }

listen_addresses: '0.0.0.0:3000'

postgres:
  connection_string: ${DATABASE_URL}

  # Never discover schemas automatically: Martin's hostname is public and
  # PostgreSQL table columns become vector-tile properties. Only sanitized
  # projection views are publishable.
  auto_publish: false
  functions: {}
  tables:
    vt_zonas_operativas:
      schema: public
      table: vt_zonas_operativas
      srid: 4326
      geometry_column: geometria
      id_column: id
      properties:
        id: Public identifier
        nombre: Zone name
        cuenca: Basin name
        superficie_ha: Area in hectares
    vt_puntos_conflicto:
      schema: public
      table: vt_puntos_conflicto
      srid: 4326
      geometry_column: geometria
      id_column: id
      properties:
        id: Public identifier
        tipo: Conflict type
        severidad: Severity
        descripcion: Public description
        acumulacion_valor: Accumulation metric
        pendiente_valor: Slope metric
    vt_denuncias:
      schema: public
      table: vt_denuncias
      srid: 4326
      geometry_column: geom
      id_column: id
      properties:
        id: Public identifier
        tipo: Report type
        estado: Public status
        cuenca: Basin name
        created_at: Creation timestamp
    vt_canal_network:
      schema: public
      table: vt_canal_network
      srid: 4326
      geometry_column: geom
      id_column: id
      properties:
        id: Public identifier
        nombre: Canal name
        tipo: Canal type
        source: Topology source node
        target: Topology target node
        cost: Routing cost
