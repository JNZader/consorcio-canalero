title = "consorcio-canalero"

# SEC-07. Pre-commit already runs gitleaks (see .pre-commit-config.yaml).
# This allowlist covers the false positives from the full-history scan:
# test fixtures (JWT_SECRET / SUPABASE_* set to test-… values) and the
# documented ACCESS_TOKEN placeholder in the WhatsApp plan.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures, the documented WhatsApp placeholder, and generic-api-key false positives"
paths = [
  '''(?:^|/)tests/''',
  '''docs/PLAN_WHATSAPP_BOT\.md''',
  # Corpus catalogue keys (`key_prefix:`), not credentials.
  '''gee-backend/app/domains/conocimiento/corpus_expectations\.yaml''',
]
regexes = [
  # Recharts dataKey, not a token.
  '''elevation_aw3d30''',
  # Public API hostname written in a comment.
  '''cc10demayo-api\.javierzader\.com''',
]
