services:
  # ============================================
  # DATABASE - PostgreSQL + PostGIS
  # ============================================
  postgres:
    image: pgrouting/pgrouting:16-3.4-3.6.1
    container_name: consorcio-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consorcio}
      POSTGRES_USER: ${POSTGRES_USER:-consorcio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consorcio_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - consorcio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consorcio -d consorcio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # BACKEND - FastAPI with GEE
  # ============================================
  backend:
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: development
    container_name: consorcio-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./gee-backend/app:/app/app:ro
      - ./gee-backend/data/waterways:/app/data/waterways
      - ./consorcio-web/public/waterways:/app/public/waterways
      - ./consorcio-web/public/capas:/app/public/capas:ro
      - ./consorcio-web/public/data:/app/public/data:ro
      - ./gee-backend/credentials:/app/credentials:ro
      - backend-cache:/app/.cache
      - geo-data:/data/geo
      - denuncia-uploads:/app/uploads
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - RATE_LIMIT_DISABLED=${RATE_LIMIT_DISABLED:-true}
      - DATABASE_URL=${DATABASE_URL:-postgresql://consorcio:consorcio_dev@postgres:5432/consorcio}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEO_WORKER_TILE_URL=http://geo-worker:8001
      - MARTIN_INTERNAL_URL=${MARTIN_INTERNAL_URL:-http://martin:3000}
      - MARTIN_PUBLIC_URL=${MARTIN_PUBLIC_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://consorcio-canalero.pages.dev,http://localhost:5173,http://localhost:3000}
      # F4.X-1: required whenever DATABASE_URL points at pgbouncer.
      # Default off here because the dev-local compose embeds postgres
      # directly; only flip to true if the developer adds a pgbouncer
      # service or points DATABASE_URL at an external pooled instance.
      - USE_PGBOUNCER=${USE_PGBOUNCER:-false}
      # F5-E: gate for the one-time-code flow. When ``true`` the
      # password-reset / email-verify hooks generate an 8-char code,
      # store it in ``email_codes``, and email ONLY the code — the
      # long JWT never leaves the backend. Defaults ``false`` so the
      # legacy ``?token=`` path keeps working on installs that don't
      # opt in. Activation requires this flag on BOTH backend and
      # worker (the worker dispatches the actual SMTP send).
      - USE_ONE_TIME_CODES=${USE_ONE_TIME_CODES:-false}
      # TrustedHostMiddleware needs an explicit accepted Host header even
      # though the healthcheck transport stays on loopback. This public,
      # non-secret override defaults to localhost for local development.
      - HEALTHCHECK_HOST=${HEALTHCHECK_HOST:-localhost}
    env_file:
      - ./gee-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consorcio-network
    healthcheck:
      # Liveness only — ``/live`` does NOT touch DB / Redis / GEE, so a
      # transient outage downstream doesn't kill this container. The Python
      # probe connects to loopback and supplies the configured Host header.
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app

  # ============================================
  # MIGRATE - one-shot alembic runner (Phase 4 / F4.X-2)
  # ============================================
  # Companion to the prod compose's migrate service. Same safety
  # contract: alembic ALWAYS talks to postgres directly, never via
  # pgbouncer (transaction mode discards session state between DDL
  # statements, leaving migrations half-applied).
  #
  # Behind a ``profiles: ["migrate"]`` so ``docker compose up -d``
  # does NOT auto-spin this container — it's a one-shot ad-hoc tool.
  # Invoke explicitly:
  #
  #   docker compose --profile migrate run --rm migrate
  #   docker compose --profile migrate run --rm migrate alembic current
  #   docker compose --profile migrate run --rm migrate alembic downgrade -1
  migrate:
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: development
    image: consorcio-backend
    container_name: consorcio-migrate
    profiles: ["migrate"]
    restart: "no"
    volumes:
      - ./gee-backend/credentials:/app/credentials:ro
    env_file:
      - ./gee-backend/.env
    environment:
      # Hard overrides — direct-to-postgres, USE_PGBOUNCER=false so
      # ``app/db/session.py`` builds the standard QueuePool engine.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-consorcio}:${POSTGRES_PASSWORD:-consorcio_dev}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-consorcio}
      - USE_PGBOUNCER=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - consorcio-network
    command: alembic upgrade head

  # ============================================
  # REDIS - Broker for Celery
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: consorcio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - consorcio-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # WORKER - Background Tasks (Celery)
  # ============================================
  worker:
    build:
      context: ./gee-backend
      dockerfile: Dockerfile
      target: development
    container_name: consorcio-worker
    restart: unless-stopped
    volumes:
      - ./gee-backend/app:/app/app:ro
      - ./gee-backend/credentials:/app/credentials:ro
      - geo-data:/data/geo
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://consorcio:consorcio_dev@postgres:5432/consorcio}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # F4.X-1: same reasoning as the backend service above. Without
      # this propagation, async celery tasks hit
      # ``DuplicatePreparedStatementError`` the moment they run
      # through pgbouncer (real incident on 2026-05-19).
      - USE_PGBOUNCER=${USE_PGBOUNCER:-false}
      # F5-E: SMTP send for password-reset / email-verify dispatches
      # from THIS worker (see ``app/auth/dependencies.py`` UserManager
      # hooks). The flag must match the backend container — if backend
      # generates a code but worker isn't gated on, the email body
      # ends up empty / inconsistent. Set both to ``true`` together.
      - USE_ONE_TIME_CODES=${USE_ONE_TIME_CODES:-false}
    env_file:
      - ./gee-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consorcio-network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: celery -A app.core.celery_app worker --loglevel=info -Q celery

  # ============================================
  # GEO WORKER - GDAL-based terrain analysis
  # ============================================
  geo-worker:
    build:
      context: ./gee-backend
      dockerfile: Dockerfile.geo
    container_name: consorcio-geo-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./gee-backend/app:/app/app:ro
      - ./gee-backend/data/waterways:/app/data/waterways:ro
      # Zona outline for clipping visual raster tiles to the consorcio —
      # single source of truth: the same geojson the frontend serves.
      - ./consorcio-web/public/capas/pilar-verde/zona_ampliada.geojson:/app/data/zona/zona_ampliada.geojson:ro
      - ./gee-backend/supervisord-geo.conf:/etc/supervisor/conf.d/geo.conf:ro
      - ./gee-backend/credentials:/app/credentials:ro
      - geo-data:/data/geo
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://consorcio:consorcio_dev@postgres:5432/consorcio}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - ./gee-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consorcio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # MARTIN - PostGIS Vector Tile Server
  # ============================================
  martin:
    image: ghcr.io/maplibre/martin:v0.14.2
    container_name: consorcio-martin
    restart: unless-stopped
    # No host port published — Martin is reached via the consorcio-network
    # docker network only (frontend/backend resolve `martin:3000` internally).
    # Host port 3000 is taken by other stacks on this box (biogas-backend),
    # so publishing here causes startup conflicts. Add it back via override
    # if you genuinely need host-side access (e.g. local debugging).
    expose:
      - "3000"
    # Pull DATABASE_URL (the real rotated postgres password) from the same
    # env_file the backend uses. Without this, martin's config.yaml falls
    # back to the hardcoded `consorcio:consorcio_dev` default which no
    # longer matches the postgres data volume after credential rotation.
    env_file:
      - ./gee-backend/.env
    environment:
      # Overrides the env_file's DATABASE_URL: that one can drift to external
      # hosts (staging/experiments) and a recreated martin then dies in a
      # DNS-lookup restart loop. Defaults to the compose-local postgres built
      # from POSTGRES_* parts (same construction as the migrate service);
      # MARTIN_DB_URL is the explicit escape hatch — same var prod uses.
      - DATABASE_URL=${MARTIN_DB_URL:-postgresql://${POSTGRES_USER:-consorcio}:${POSTGRES_PASSWORD:-consorcio_dev}@postgres:5432/${POSTGRES_DB:-consorcio}}
    volumes:
      - ./martin/config.yaml:/config/config.yaml:ro
    command: --config /config/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - consorcio-network
    healthcheck:
      # 127.0.0.1, NOT localhost: inside the container localhost resolves to
      # ::1 (IPv6) first and Martin binds IPv4 0.0.0.0 only, so the wget got
      # connection-refused and marked a perfectly healthy Martin unhealthy.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================
  # TRAINER - U-Net Water Segmentation (GPU)
  # ============================================
  trainer:
    build:
      context: ./gee-backend
      dockerfile: Dockerfile.trainer
    container_name: consorcio-trainer
    profiles: [training]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./gee-backend/app:/app/app:ro
      - ./gee-backend/scripts:/app/scripts:ro
      - ./gee-backend/credentials:/app/credentials:ro
      - ./consorcio-web/public/capas:/app/capas:ro
      - geo-data:/data/geo
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gee-sa-key.json
    env_file:
      - ./gee-backend/.env
    depends_on:
      - postgres

  # ============================================
  # FRONTEND - React with Vite
  # ============================================
  frontend:
    build:
      context: ./consorcio-web
      dockerfile: Dockerfile
      target: development
    container_name: consorcio-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./consorcio-web/src:/app/src:ro
      - ./consorcio-web/public:/app/public:ro
      - ./consorcio-web/.env:/app/.env:ro
      - frontend-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - VITE_API_URL=http://localhost:8000
      - VITE_MARTIN_URL=http://localhost:3000
    env_file:
      - ./consorcio-web/.env
    depends_on:
      - backend
    networks:
      - consorcio-network
    command: npm run dev -- --host 0.0.0.0

# ============================================
# NETWORKS
# ============================================
networks:
  consorcio-network:
    driver: bridge
    name: consorcio-network

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres-data:
    name: consorcio-postgres-data
  backend-cache:
    name: consorcio-backend-cache
  frontend-node-modules:
    name: consorcio-frontend-node-modules
  geo-data:
    name: consorcio-geo-data
  denuncia-uploads:
    name: consorcio-denuncia-uploads
