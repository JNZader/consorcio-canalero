# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Keep ruff/mypy revs aligned with gee-backend/{requirements,requirements-dev}.lock

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  # Python - Ruff (fast linter + formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^gee-backend/
      - id: ruff-format
        files: ^gee-backend/

  # Python - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^gee-backend/app/
        args: [--ignore-missing-imports]
        additional_dependencies:
          - pydantic>=2.0
          - fastapi>=0.100

  # JavaScript/TypeScript - Biome 2 (aligned with consorcio-web/@biomejs/biome)
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.14
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.14"]
        files: ^consorcio-web/src/

  # Docker
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3013]

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Commit message format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [hadolint-docker]
  submodules: false
