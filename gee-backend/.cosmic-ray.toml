  # issue: measure
  # "app/domains/geo/rainfall/policy.py",
  # "app/domains/geo/rainfall/service.py",
  # "app/domains/geo/rainfall/temporal.py",
  # Task 3.19 (rainfall-materialization): compute.py joins this same
