]
timeout = 120.0
excluded-modules = []
# Solo tests SIN base de datos: el harness corre este comando una vez por
# mutante, asi que cada segundo se multiplica por cientos.
test-command = "python3 -m pytest tests/test_tramites_schema.py tests/test_mutation_targets.py tests/test_mutation_targets_finanzas.py tests/test_mutation_targets_padron.py -q"

[cosmic-ray.distributor]
name = "local"
