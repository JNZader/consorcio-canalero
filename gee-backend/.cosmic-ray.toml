  # "app/domains/geo/rainfall/compute.py",
  # ── consorcio-rag (task 4.13): los cuatro modulos puros del dominio
  #    conocimiento. PENDIENTE de medir, por el MISMO motivo que rainfall:
  #    el unico interprete local es el venv 3.11 sin cosmic-ray instalado, y la
  #    regla del repo es no cablear lo no medido (sin numero, no hay gate).
  #
  #    Los tests ya existen y NO tocan base de datos, que es la condicion que
  #    hace barato el harness (un `pytest` por mutante):
  #      parser.py     -> tests/new/conocimiento/test_rag_parser.py (+ _traps)
  #      fusion.py     -> tests/new/conocimiento/test_rag_fusion.py       12 casos
  #      abstention.py -> tests/new/conocimiento/test_rag_abstention.py   21 casos
