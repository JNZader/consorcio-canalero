[cosmic-ray]
module-path = [
  "app/domains/denuncias/service.py",
  "app/domains/monitoring/service.py",
  "app/domains/tramites/schemas.py",
  # ── etapa 1 del plan escalonado, MEDIDA y habilitada (B4d, 2026-08-04) ──
  # 74 mutantes. Medido en LOS DOS interpretes, porque el numero depende del
  # interprete y el que manda es el de CI:
  #
  #   Python 3.11 (EL DE CI, `python-version: '3.11'` en backend.yml):
