  # Comando de medicion (cuando haya un 3.11 con cosmic-ray):
  #   cosmic-ray init .cosmic-ray.rainfall.toml /tmp/cr.sqlite
  #     (con test-command "python3.11 -m pytest tests/test_mutation_targets_rainfall.py -q")
  #   cosmic-ray exec /tmp/cr.sqlite  &&  scripts/cosmic_gate.py
  # y ahi decidir si entran al gate (el gate real suma timeout a la cola) o en
