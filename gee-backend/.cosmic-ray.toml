[cosmic-ray]
module-path = [
  "app/domains/denuncias/service.py",
  "app/domains/monitoring/service.py",
  "app/domains/tramites/schemas.py",
  # ── etapa 1 del plan escalonado, MEDIDA y habilitada (B4d, 2026-08-04) ──
  # 74 mutantes. Medido en LOS DOS interpretes, porque el numero depende del
  # interprete y el que manda es el de CI:
  #
  #   Python 3.11 (EL DE CI, `python-version: '3.11'` en backend.yml):
  #     72/74 = 97.30 % — 1 min 16 s, ~1.0 s por mutante.
  #     Sobreviven 2, ambos sobre el marcador `*` de keyword-only de
  #     list_gastos / list_ingresos (mutado a `/`, que deja las llamadas por
  #     keyword funcionando igual). Cero sobrevivientes de comportamiento.
  #
  #   Python 3.14 (el venv local): 61/74 = 82.43 % — 2 min 21 s.
  #     Sobreviven 13: los 2 de arriba MAS 11 sobre el `|` de la anotacion
  #     `FinanzasRepository | None`. En 3.14 las anotaciones se evaluan en forma
  #     diferida (PEP 649) y la anotacion mutada nunca corre; en 3.11 se evaluan
  #     eager, `FinanzasRepository + None` explota al importar y los 11 mueren.
  #
  # O sea: el numero local de 3.14 es el PESIMISTA. En CI el gate ve 97 %.
  "app/domains/finanzas/service.py",
  # ── etapa 2 del plan escalonado, MEDIDA y habilitada (2026-08-04) ──
  # 191 mutantes. Medido en LOS DOS interpretes, igual que finanzas, porque el
  # numero depende del interprete y el que manda es el de CI:
  #
  #   Python 3.11 (EL DE CI, `python-version: '3.11'` en backend.yml):
  #     182/191 = 95.29 % — 2 min 33 s, 0.80 s por mutante con el test-command
  #     reducido al archivo de padron.
  #
  #   Python 3.14 (el venv local): 171/191 = 89.53 % — 5 min 32 s.
  #
  # La diferencia son EXACTAMENTE los 11 mutantes del `|` de la anotacion
  # `PadronRepository | None`, el mismo caso que finanzas: con PEP 649 (3.14) la
  # anotacion se evalua diferida y la version mutada nunca corre; en 3.11 se
  # evalua eager, `PadronRepository + None` explota al importar y los 11 mueren.
  # O sea: el numero local de 3.14 vuelve a ser el PESIMISTA, y aun asi queda
  # 59 pp por encima del piso de 0.30 que pide `cosmic_gate.py`.
  #
  # Los 9 sobrevivientes de 3.11 son equivalentes, no huecos de test:
  #   linea 125  `exclude_unset=True` -> `False`. El unico consumidor del dump es
  #              `"cuit" in update_fields and update_fields["cuit"] is not None`,
  #              y el guard `is not None` hace que las dos variantes se comporten
  #              igual.
  #   linea 245  `created > 0` -> `created != 0`. `created` es un contador que
  #              arranca en 0 y solo sube: nunca es negativo.
  #   linea 324  `idx < len(values)` -> `<=`, `!=`, `is not`. openpyxl rellena
  #              cada fila hasta el ancho de la hoja, asi que `idx` nunca llega a
  #              `len(values)` y la rama `else None` es inalcanzable.
  #   linea 338  `sheet.nrows == 0` -> `== 1`, `== -1`, `< 0`, `<= 0`. Con
  #              `nrows` no negativo las cuatro coinciden con el original de los
  #              dos lados del guard.
  #
  # El gate pasa de 350 a 541 mutantes (350 + 191).
  "app/domains/padron/service.py",
  # TODO(mutation-coverage): falta la etapa 3 -- auth/refresh_tokens.py (300
  # mutantes, el de mayor valor y el mas caro). La receta ya esta probada dos
  # veces y NO es "correr los tests con DB mas rapido": el service no toca la
  # base, delega todo en el repository, asi que se testea con un repositorio y
  # una Session falsos (MagicMock). Ver tests/test_mutation_targets_finanzas.py
  # y tests/test_mutation_targets_padron.py. refresh_tokens merece su propio
  # job/config con su propio piso antes que empujar este gate contra los 35
  # minutos de timeout-minutes. Medicion y plan completos en
  # .cosmic-ray.candidate.toml.
]
timeout = 120.0
excluded-modules = []
# Solo tests SIN base de datos: el harness corre este comando una vez por
# mutante, asi que cada segundo se multiplica por cientos.
test-command = "python3 -m pytest tests/test_tramites_schema.py tests/test_mutation_targets.py tests/test_mutation_targets_finanzas.py tests/test_mutation_targets_padron.py -q"

[cosmic-ray.distributor]
name = "local"
