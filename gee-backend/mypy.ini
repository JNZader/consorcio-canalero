# Mypy configuration for the Consorcio Canalero backend.
#
# Default policy is permissive (``ignore_missing_imports = True``)
# because the codebase has many third-party packages without published
# stubs (rasterio, shapely, scipy, ee, etc.) and chasing all of them
# at once would gate every commit on incidental refactors.
#
# A small set of SECURITY- and PII-sensitive modules is excepted —
# those run with ``ignore_missing_imports = False`` so a typo in an
# import name or a missing-stub introduction can't slip through
# unreviewed. Bumping more modules into the strict set is welcome,
# but it should be a deliberate decision (cf. roadmap F2/F4).

[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# -------------------------------------------------------------------
# Strict scope — auth, padron, denuncias.
# -------------------------------------------------------------------
# These are the modules the Phase 0 / Phase 1 audit flagged as most
# directly exposing PII or auth-controlled data. We require that
# every external import resolves to either a typed package or an
# explicit per-module override below.

[mypy-app.auth.*]
ignore_missing_imports = False

[mypy-app.domains.padron.*]
ignore_missing_imports = False

[mypy-app.domains.denuncias.*]
ignore_missing_imports = False

# -------------------------------------------------------------------
# Per-package overrides for stubless third-party imports that the
# strict modules above legitimately need.
# -------------------------------------------------------------------

[mypy-fastapi_users.*]
ignore_missing_imports = True

[mypy-fastapi_users_db_sqlalchemy.*]
ignore_missing_imports = True

[mypy-httpx_oauth.*]
ignore_missing_imports = True

[mypy-google.auth.*]
ignore_missing_imports = True

[mypy-google.oauth2.*]
ignore_missing_imports = True

[mypy-xlrd.*]
ignore_missing_imports = True
