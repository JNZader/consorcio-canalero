# The eight Ley 8803 access-to-information drafts, as slots.
#
# Read `editor.py` first: it explains the three slot classes and why the export is
# fail-closed. In short:
#
#   {{legal:<id>}}   a legal citation. It renders the slot's `cita` and is pinned to
#                    (citation_key, span, vigencia, sha) in `legales` below. Export
#                    re-checks every one of them with `normas.chequear`.
#   {{id:<slot>}}    document-identification data, typed by a human and confirmed by
#                    a human (`identificacion_confirmada: true`). Never retrieval
#                    output, never verified against the corpus.
#   {{bloque:<id>}}  a paragraph shared verbatim by several drafts (`bloques`).
#   [PLACEHOLDER]    the human-only block. Written literally, never substituted.
#
# Legal text may enter a template ONLY through `{{legal:...}}`: the loader refuses a
# template that names an `art. N` or a `Ley N` anywhere else.
#
# THE SHA BELOW IS A PIN, NOT A DEFAULT. When the corpus snapshot moves, every
# export refuses with cause `sha` until a human re-checks these slots against the new
# snapshot and bumps this value on purpose. The editor never re-pins by itself.

version: 1

corpus:
  # Same snapshot `corpus_expectations.yaml` pins.
  sha: "ecab0a0ed9cfbfb7bca0f7673f0283bc75bb406e"
  documentos:
    ley-8803:
      # Copied verbatim from the `estado_vigencia` frontmatter of
      # ley-8803-acceso-informacion-cordoba.md: `chequear` compares it for equality
      # against what ingestion stored.
      vigencia: "VIGENTE al 2026-08-05, sin modificatorias registradas por ninguna de las dos fuentes. SAIJ marca la norma como \"Vigente, de alcance general\". La ficha de la Fiscalía de Estado no consigna nota alguna de modificación, derogación ni reglamentación (su bloque \"NOTICIAS ACCESORIAS\" sólo trae fecha de sanción, publicación y cantidad de artículos) — y esa misma base SÍ consigna esas notas cuando existen, como se comprobó en las fichas de las leyes 8835 y 10618. SE DESCARTÓ EXPRESAMENTE, por verificación directa, que la Ley 10618 (2019, \"Simplificación y Modernización de la Administración\") haya modificado esta ley: 10618 reforma la Ley 5350 (t.o. 6658) de procedimiento administrativo, no menciona el número 8803 ni una vez, y no contiene la expresión \"acceso a la información\". También se descartó que la Ley 8835 (Carta del Ciudadano, 2000) contenga previsiones de acceso a la información que la desplacen. LÍMITE HONESTO DE ESTA VERIFICACIÓN: no fue posible correr una búsqueda exhaustiva de legislación posterior (el buscador de texto completo de SAIJ devuelve cero incluso para consultas de control, y la Fiscalía de Estado no expone buscador). Que no se haya hallado una ley provincial de transparencia posterior, o una adhesión de Córdoba a la Ley nacional 27275, NO equivale a haber probado que no exista. Conviene reconfirmarlo antes de litigar."

