bloques:
  apertura: |
    > **[REQUERENTE]**, D.N.I. **[DNI]**, con domicilio **[DOMICILIO / CORREO]**, en
    > ejercicio del derecho de acceso a la información pública reconocido por la
    > **{{legal:ley}}** de la Provincia de Córdoba, solicita se le entregue copia
    > {{id:objeto_intro}}
  limites_documento: |
    > **Aclaración sobre eventuales límites.** Si alguna parte del documento
    > estuviera alcanzada por las restricciones del {{legal:art3}}, solicito se entregue el
    > **resto** del documento, conforme al {{legal:art4}} de la {{legal:ley}}. La invocación de
    > una cláusula restringida no habilita la negativa total.
  costo_gratuito: |
    > **Costo.** El {{legal:art5}} establece que el acceso es gratuito, salvo el cargo por
    > reproducción. Renuncio a reproducción y solicito la respuesta por correo
    > electrónico, sin cargo.
  cierre: |
    > Solicito se entregue **constancia** del presente requerimiento, conforme al
    > {{legal:art6_constancia}} de la {{legal:ley}}, con indicación de la fecha de presentación, que fija el
    > inicio del plazo del {{legal:art7}}.
    >
    > Sin otro particular, agradezco.

    **Lugar y fecha:** ______________________, ______ de ______________.

    **Firma del requerente:**

    _________________________________

    **[REQUERENTE]** — D.N.I. **[DNI]**
  correo_formalidad_gratis: |
    El {{legal:art6_formalidad}} de la {{legal:ley}} no exige otra formalidad que la identificación del
    requirente y del documento buscado, y no puede exigirse que explique el fin de
    la solicitud. Renuncio a reproducción física: solicito la respuesta por este
    correo, sin cargo.
  correo_limites: |
    Si alguna parte estuviera alcanzada por el {{legal:art3}}, solicito se entregue el
    resto conforme al {{legal:art4}}.
  correo_cierre: |
    Solicito constancia de este requerimiento con la fecha de presentación, que fija
    el plazo del {{legal:art7}} (diez días hábiles).

    Quedo a la espera.

    Atentamente,

    [REQUERENTE] - D.N.I. [DNI]
    [DOMICILIO / CORREO]

pedidos:
  "1":
    titulo: "Acta Acuerdo del FDA (F-2)"
    identificacion_confirmada: true
    identificacion:
      art62_ley11089: "art. 62 de la Ley 11089"
      art17_ley10679: "art. 17 de la Ley 10679"
      art62_ley11089_asunto: "art. 62 Ley 11089"
    cuerpo: |
      > Señor
      > MINISTRO DE BIOAGROINDUSTRIA
      > Provincia de Córdoba
      >
      > **[REQUERENTE]**, D.N.I. **[DNI]**, con domicilio **[DOMICILIO / CORREO]**, en
      > ejercicio del derecho de acceso a la información pública reconocido por la
      > **{{legal:ley}}** de la Provincia de Córdoba, solicita se le entregue copia del
      > siguiente documento en poder de ese Ministerio:
      >
      > **El acta acuerdo celebrada con las entidades rurales —o el instrumento que
      > haga sus veces— que ratifica el {{id:art62_ley11089}} y en la cual se fija el
      > destino del 0,90 % de la Contribución Especial FDA entre los doce incisos del
      > {{id:art17_ley10679}}, correspondiente a la anualidad 2026.**
      >
      > Se identifica el documento por su naturaleza y por la norma que lo aprueba,
      > conforme al {{legal:art6_formalidad}} de la {{legal:ley}}, que no exige otra formalidad que la
      > identificación del documento buscado.
      >
      > **Fundamento de la solicitud.** El {{id:art17_ley10679}} abre doce incisos
      > de destino y **la ley no asigna porcentaje a ninguno**. Sin el acta acuerdo no
      > hay forma de saber cuánto de lo recaudado corresponde al inc. g) —canales de
      > desagüe y red de drenaje—, que es justamente el interés de quien suscribe. El
      > acta no es anexo de la ley ni está en ninguna fuente abierta: su existencia
      > está confirmada por el propio {{id:art62_ley11089}}, que la ratifica.
      >
      > **Aclaración sobre eventuales límites.** Si alguna cláusula del acta estuviera
      > alcanzada por las restricciones del {{legal:art3}} —por ejemplo, información de un
      > tercero o de carácter confidencial—, solicito se me entregue el **resto del
      > documento**, conforme al {{legal:art4}} de la {{legal:ley}}, que obliga a suministrar la
      > información no limitada cuando sólo una parte lo está. La invocación de una
      > cláusula restringida no habilita la negativa total del acta.
      >
      > **Costo.** El {{legal:art5}} establece que el acceso es gratuito, salvo el cargo por
      > reproducción, que se aplica sólo si yo solicito copias físicas. Renuncio a
      > reproducción y solicito la respuesta por correo electrónico, sin costo.
      >
      > Solicito se entregue **constancia** del presente requerimiento, conforme al
      > {{legal:art6_constancia}} de la {{legal:ley}}, con indicación de la fecha de presentación, que es la
      > que fija el inicio del plazo del {{legal:art7}}.
      >
      > Sin otro particular, agradezco.

      **Lugar y fecha:** ______________________, ______ de ______________.

      **Firma del requerente:**

      _________________________________

      **[REQUERENTE]** — D.N.I. **[DNI]**
    correo: |
      Asunto: Acceso a la información pública - {{legal:ley}} - Acta Acuerdo FDA ({{id:art62_ley11089_asunto}})

      Señores del Ministerio de Bioagroindustria:

      Por medio del presente ejerzo el derecho de acceso a la información pública
      ({{legal:ley}}, Provincia de Córdoba) y solicito copia del acta acuerdo con las
      entidades rurales que ratifica el {{id:art62_ley11089}} y fija el destino del
      0,90 % de la Contribución Especial FDA entre los doce incisos del {{id:art17_ley10679}}, correspondiente a la anualidad 2026.

      {{bloque:correo_formalidad_gratis}}

      Si alguna cláusula del acta estuviera alcanzada por el {{legal:art3}}, solicito se
      entregue el resto del documento conforme al {{legal:art4}}.

      {{bloque:correo_cierre}}

