# The provider terms behind the model pin — task 6.7, a BLOCKING pre-enablement
# gate (`design.md:493-497`, amendment A2).
#
# This file is the record, not the verification. The verification is an
# operational act the OWNER performs against the live pool and the provider's
# published terms; the procedure is in `docs/rag/proveedor-terminos.md`.
# `verificar_terminos` refuses unless this record covers the live pin. The
# serving flag is a separate AND and stays off. Fail-closed, not a warning.
#
# It is checked in and lives next to the pin so that a silent terms change is a
# diff rather than a discovery.

# The exact model id AS THE POOL EXPOSES IT. Not the name from a blog post: the
# pin is worthless if it does not name a real route (amendment A2, point 1).
# Owner 2026-10-07: serving/eval is GLM Go, not Fable. Live catalog still lists
# GLM-5.3-Flash. Previous Fable pin (#269) is discarded (no Max sub). Do not mix
# Fable gold (2026-09-02) with the GLM pack (2026-09-30).
modelo_id: opencode-go/glm-5.3-flash
# The pool the pin is routed through. The same model id behind a different
# operator is different terms and different retention.
pool: opencode-cli

# VERIFIED 2026-10-07. Flip only together with the evidence fields below, in the
# same commit, with the owner's name on it.
verificado: true

# --- evidence (all four required; a record nobody can audit is a claim) -------
# ISO date on which the terms were read.
verificado_el: "2026-10-07"
# Who read them. A verification with no author is a rumour.
verificado_por: Javier
# The URL of the published terms that were read.
# The Go privacy page is the document that publishes the two substantive
# criteria (training + retention).
fuente_url: https://opencode.ai/docs/go/
# sha256 of the terms text as read, so a later silent edit is detectable.
# `curl -sS -L -A 'Mozilla/5.0' https://opencode.ai/docs/go/ | sha256sum`
# on 2026-10-07. Differs from the 2026-09-01 digest (page grew new rows);
# GLM-5.3-Flash still Not used / 0 days with no ZDR asterisk.
sha256_terminos: b1b8d8d8d756faa470b3f978ab02f9b2d6803aa33cffca40198e92a7b290078e

# --- the two substantive criteria --------------------------------------------
# Does the provider publish that it does NOT train on API input? A provider that
# trains on inputs is ineligible regardless of price or latency: the ratified
# privacy amendment permits public law text plus the CD member's question to
# leave the box, not to become training data.
no_entrenamiento: true
# The published retention window for API traffic, in days. Must be a bounded
# number: "they keep it for a while" is not a retention term. 0 means the
# provider publishes that it retains nothing, and 0 is a legitimate value here —
# the best one.
#
# UPPER BOUND: 1095 days (3 years, `proveedores.RETENCION_MAX_DIAS`). Anything
# larger REFUSES. A very large number is not a bounded window with a big value in
# it; it is indefinite retention written in days, and the questions a CD member
# asks about their own consorcio are not archive material for the provider. If a
# provider's published term is genuinely longer and the owner still wants the
# pin, that is a decision to record and to raise the constant with, not a value
# to slip past a type check.
#
# GLM-5.3-Flash on the Go privacy table 2026-10-07: Model training Not used,
# Data retention 0 days — NO asterisk. DeepSeek rows still carry 0 days*.
# Do not pin Muse Spark (training Yes / not ZDR). Do not pin DeepSeek until
# its ZDR footnote is current. Do not treat the zen/go HTTP path as OpenCode
# Zen free-tier (`opencode/*-free`); this pin is Go via opencode-cli.
retencion_dias: 0
