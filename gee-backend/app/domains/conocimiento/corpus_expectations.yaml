clases_excluidas:
  comentario-del-corpus: 'Comentario del corpus SOBRE la norma (relevancia, advertencias, notas de vigencia,
    discrepancias, índices, «qué prueba y qué no»). Excluido a propósito: citarlo devolvería la opinión
    del corpus con cara de norma, que es exactamente el fallo que este diseño existe para impedir.'
  contenedor-estructural: Encabezado que sólo agrupa unidades ya indexadas (LIBRO/TÍTULO/CAPÍTULO, «Articulado»,
    «Parte resolutiva», anexos articulados). Indexarlo duplicaría a sus hijos.
  contenido-no-declarado: Contenido sustantivo presente en el archivo que el MANIFEST v2 no declara como
    unidad. Excluido del índice V0 y anotado aquí para que la decisión sea explícita y revisable — no
    silenciosa (ledger RAG2-001).
  encabezado-y-preambulo: 'Encabezado, VISTO, CONSIDERANDO, POR ELLO y fórmula del acto: preámbulo, no
    parte dispositiva. Los dos actos donde el MANIFEST sí los declara los indexan como `considerando`.'
  firma-y-promulgacion: Firmas, pie y bloque de promulgación. Identifican quién firmó; no crean regla
    citable.
  procedencia-y-verificacion: Cadena de obtención y verificación de la fuente, escrita por el corpus.
    Es metadato de procedencia, no texto de la norma.
  titulo-documento: 'Título raíz del documento. No es una unidad: su contenido son las secciones hijas,
    que se indexan por separado.'
