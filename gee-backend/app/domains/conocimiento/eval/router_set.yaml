# Router labeled set — RATIFIED
#
# The four-class set the router is calibrated and scored on. Ratified verbatim by
# the owner on 2026-08-24 (tasks.md decision 0.3, design.md A4 at :1285-1293).
# Provenance: `artifacts/rag/router_gold_draft-2026-08-24.yaml`, which is NOT
# committed; this file is its ratified projection, item for item, with the ids
# preserved so a question can be traced back to the draft that was reviewed.
#
# WHY THIS ONE IS COMMITTABLE AND `gold_set.yaml` IS NOT (fully). Every question
# here is SYNTHETIC: written for this set, in an operator's register, about no
# real person, no real expediente and no real parcel. None was transcribed from a
# `privado` document, so none inherits a classification (see `gold_set.yaml`'s
# header for the rule that governs the retrieval gold). Disjunction from the
# retrieval gold was verified mechanically on the 49 x 26 pairs: zero exact
# duplicates, maximum content-token Jaccard 0.214.
#
# ---------------------------------------------------------------------------
# WHAT THE FIELDS MEAN
# ---------------------------------------------------------------------------
# estado          Must start with `RATIFICADO`. `eval.router.cargar_router_set`
#                 REFUSES to score anything else and the report block says
#                 `not-evaluable` instead of printing numbers (routing
#                 spec:100-104).
# id              Stable. Never reordered, never recycled.
# pregunta        Verbatim. Four entries carry deliberate typos (no accents, no
#                 opening question mark) — L-05, O-04, G-04, M-04 — because that
#                 is how text arrives from a real keyboard.
# clase_esperada  legal | operational | geoespacial | mixto
# borde           true = deliberately hard; expected to be what hurts in the
#                 confusion matrix. Carried so a regression can be read as
#                 "the borderline items moved" rather than as a flat accuracy drop.
# justificacion   One line: why that class.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE DOES **NOT** CONTAIN
# ---------------------------------------------------------------------------
# The numeric bar. `operational -> legal <= 0.05` and `overall >= 0.85` are still
# PROPOSALS (design.md:175-186) and decision 0.3 is explicit that the bar is
# fixed only AFTER measuring on this set. Nothing here, and nothing in
# `routing.py`, turns a measurement into a pass or a fail; `evaluar_barra`
# reports the figures under the state `barra_no_ratificada` and issues no verdict.

