# Gold set — consorcio-rag V0 evaluation
#
# Ratified verbatim by the owner on 2026-08-10 (Ops O.2): 29 answerable + 23
# unanswerable = 52. Source: `eval-preguntas-oro-DRAFT-2026-08-10.md`, whose
# provenance record is `docs/rag/gold-set-provenance.md`.
#
# ---------------------------------------------------------------------------
# WHY SOME QUESTIONS HAVE NO TEXT HERE (`origen: privado`)
# ---------------------------------------------------------------------------
# This repository is PUBLIC. `consorcio-corpus-legal` is PRIVATE, and every
# document it holds is ingested with `clasificacion = 'privado'` by default-deny
# (repository.documento_row_from_frontmatter). Twenty-six of these questions were
# transcribed from documents carrying that classification — the audit's §5
# questions for the commission, the canal N°5 legal analysis, and one question
# about the consortium's own approved files.
#
# The rule applied is the corpus's own, one layer up: **a question inherits the
# classification of the document it was transcribed from.** Publishing them to a
# public git remote is strictly more exposure than the external API call that
# `assert_public_domain` already refuses by default, and permanent besides.
#
# So those items carry `pregunta_ref` instead of `pregunta`, and the text is
# resolved at run time from the YAML at `RAG_GOLD_PRIVADO_PATH` (owner-side, next
# to the corpus, never committed here). An unresolved item is NOT silently
# dropped: the harness scores what it can and REFUSES go/no-go while any item is
# unresolved, exactly as it refuses while any item is `validado_por: draft`.
#
# This is a safe default, not a ratified decision — the owner ratified the SET,
# and the publication surface was never put to him. Flipping it is a data move
# with no code change: paste the text into `pregunta` and drop `pregunta_ref`.
#
# ---------------------------------------------------------------------------
# TWO CAVEATS THE SOURCE DOCUMENT ITSELF RAISES, RECORDED RATHER THAN RESOLVED
# ---------------------------------------------------------------------------
# * Q-1 (titular de concesión) — the draft's Descartes §1 rejects a duplicate of
#   this question as having "no citable answer ... zona gris real", while the
#   count table lists it among the 7 answerable. Both are true of different
#   things: V0 measures RETRIEVAL, not legal certainty. The units that decide the
#   tension (`5589#238` habilita sin exigir concesión, `5589#239` permite
#   oponerse por su falta) exist and are retrievable; whether a lawyer can
#   conclude from them is out of V0's scope. It stays answerable, and this note
#   is why.
# * Q-4 (dónde está la reglamentación del art. 235) — the reglamentación is NOT
#   in the corpus (the analysis records it as unpublished). The retrievable
#   answer is the article that makes the remission, so `citas_esperadas` is
#   `5589#235` and a correct system returns it plus nothing else.
#
# Both are flagged for the owner; neither was re-classed unilaterally.
#
# ---------------------------------------------------------------------------
# SCHEMA
# ---------------------------------------------------------------------------
#   id               stable identifier, also the key into the private file
#   pregunta         the question verbatim (public items only)
#   pregunta_ref     source anchor for the text (private items only)
#   clase            answerable | unanswerable | trampa-vigencia
#                    `trampa-vigencia` IS answerable — it is the subset whose
#                    correct answer depends on a caveat unit, and it counts
#                    toward the 29. Only `unanswerable` is excluded.
#   subclase         the draft's own taxonomy, carried for traceability
#   citas_esperadas  expected citation keys, verbatim per the MANIFEST convention
#   citas_vigencia   the subset of citas_esperadas carrying the vigencia caveat
#   fuente           where the question and its citations came from
#   validado_por     draft | owner
#   dificultad       facil | media | dificil
#   origen           publico | privado

