# ===========================================
# Docker Compose - Produccion (Hetzner / Dockge)
# ===========================================
# Frontend: Cloudflare Pages (NO incluido aqui).
# Esquema: imagenes pre-buildeadas desde GHCR.
# PostgreSQL y Redis son EXTERNOS (shared stack).
# Redes: proxy y backend son EXTERNAS (creadas una vez en el server).
#
# Arquitectura de dominios:
#   consorcio.DOMINIO       → Cloudflare Pages (frontend React)
#   api.consorcio.DOMINIO   → Caddy → consorcio-backend:8000
#   tiles.consorcio.DOMINIO → Caddy → consorcio-martin:3000
#
# Caddyfile en el server:
#   api.consorcio.{$DOMAIN} {
#     reverse_proxy consorcio-backend:8000
#   }
#   tiles.consorcio.{$DOMAIN} {
#     reverse_proxy consorcio-martin:3000
#   }
#
# Uso en servidor:
#   cp docker-compose.prod.yml /home/javier/stacks/consorcio/docker-compose.yml
#   cp .env.prod.example /home/javier/stacks/consorcio/.env  # editar con valores reales
#   cp martin/config.prod.yaml /home/javier/stacks/consorcio/martin-config.yaml
#   cd /home/javier/stacks/consorcio && docker compose up -d
# ===========================================

services:
  # --- PgBouncer transaction-pool (Phase 4 / F4-F) ---
  # Sits between the app containers and postgres so SQLAlchemy
  # connection pools collapse onto a single multiplexed channel
  # instead of holding 40+ direct postgres backends per worker.
  #
  # Hard prereqs (encoded in app/db/session.py when USE_PGBOUNCER=true):
  #   - ``poolclass=NullPool`` on both engines (SA pool layered over
  #     PgBouncer's pool is redundant and inflates max_client_conn).
  #   - ``connect_args["prepared_statement_name_func"] = lambda:
  #     f"__asyncpg_{uuid4()}__"`` so PgBouncer-multiplexed backends
  #     don't collide on auto-enumerated prepared-statement names.
  #
  # If ``USE_PGBOUNCER`` is unset / false the backend still talks to
  # postgres directly via DATABASE_URL; this service stays up but is
  # unused. Toggle both env vars together.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: consorcio-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-consorcio}
      # ``:?`` makes docker-compose fail loudly at ``up`` time if
      # ``.env`` doesn't set the var — otherwise the substitution is
      # an empty string and PgBouncer reports a cryptic
      # ``FATAL: password authentication failed`` that looks like a
      # creds problem instead of a config problem.
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required when pgbouncer is in the stack}
      DB_NAME: ${POSTGRES_DB:-consorcio}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "25"
      # ``DISCARD ALL`` between transactions flushes prepared
      # statements + session state on the postgres backend before it
      # rejoins PgBouncer's pool. SA docs flag this as mandatory.
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "5432"
    networks:
      - backend
      - consorcio-internal
    # NOTE: postgres is EXTERNAL to this compose file (see header
    # comment — "PostgreSQL y Redis son EXTERNOS (shared stack)").
    # Declaring ``depends_on: postgres`` here would fail
    # ``docker compose up`` with "service postgres is not defined".
    # We rely on the healthcheck below + restart policy to handle
    # the case where postgres isn't ready yet at startup.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # --- One-shot DB migration runner ---
  # Runs `alembic upgrade head` against the production DB and exits 0.
  # The backend / celery-worker depend on this with
  # ``service_completed_successfully`` so they never start against an
  # out-of-date schema. If the migration fails, dependents don't start
  # and the deploy fails loudly instead of producing 500s at runtime.
  #
  # ``migrate`` ALWAYS talks to postgres directly (not via PgBouncer)
  # — alembic emits DDL with session-level state PgBouncer transaction
  # mode would discard between batches.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/jnzader/consorcio-canalero/backend:latest}
    container_name: consorcio-migrate
    # NO ``profiles:`` here — backend / celery-worker / celery-beat
    # all declare ``depends_on: migrate: service_completed_successfully``
    # so this one-shot has to be picked up by every ``docker compose up -d``.
    # The legacy ``docker-compose.yml`` (dev-local) DOES use a profile
    # because it has no dependency chain on migrate — invocation there
    # is purely ad-hoc.
    env_file: .env
    # 3vr fix-forward on commit 253e727 (then F4.X-3 retroactive 3vr):
    # when ``USE_PGBOUNCER=true`` the .env-resolved DATABASE_URL
    # points at pgbouncer:5432, which breaks alembic DDL (transaction
    # mode discards session state between statements). TWO overrides
    # below — both required:
    #   1. ``DATABASE_URL`` → postgres directly (bypass pgbouncer).
    #   2. ``USE_PGBOUNCER=false`` so ``app/db/session.py`` builds
    #      the standard QueuePool engine with normal prepared
    #      statements, instead of the NullPool +
    #      ``prepared_statement_name_func`` branch that's meant for
    #      runtime PgBouncer traffic. Without (2) alembic would
    #      receive UUID-suffixed prepared-statement names that
    #      it doesn't need and that confuse some Postgres tooling.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-consorcio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-consorcio}
      USE_PGBOUNCER: "false"
    command: alembic upgrade head
    networks:
      - backend
      - consorcio-internal
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # --- One-shot uploads ownership repair ---
  # Named volumes outlive image rebuilds, so Dockerfile ownership only applies
  # when a volume is first created. Run as root on every deployment to repair
  # an existing volume, then require successful completion before backend starts.
  uploads-init:
    image: ${BACKEND_IMAGE:-ghcr.io/jnzader/consorcio-canalero/backend:latest}
    container_name: consorcio-uploads-init
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        chown -R app:app /app/uploads
        chmod 0750 /app/uploads
    volumes:
      - denuncia-uploads:/app/uploads
    network_mode: none
    read_only: true
    restart: "no"

  # --- Backend FastAPI ---
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jnzader/consorcio-canalero/backend:latest}
    container_name: consorcio-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Exact proxy IPs/CIDRs or Docker DNS names. The launcher resolves
      # "caddy" to its current peer IP before binding; no subnet or wildcard.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,caddy}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - geo-data:/data/geo
      # User-uploaded denuncia photos live here. Without a named volume the
      # files vanish on every `docker compose up -d --pull` (image rebuild),
      # which is exactly what happened in past deploys.
      - denuncia-uploads:/app/uploads
    networks:
      - proxy
      - backend
      - consorcio-internal
    healthcheck:
      # Liveness only. /live doesn't touch DB/Redis/GEE — a transient
      # outage downstream must NOT kill this container. /ready (with
      # real dep checks + 503) is for load balancers, not Docker.
      #
      # We forge the Host header to match ``API_BASE_URL`` because
      # ``TrustedHostMiddleware`` no longer accepts ``localhost`` (any
      # container on the same Docker network could have used it to
      # impersonate the API). ``HEALTHCHECK_HOST`` falls back to the
      # hostname stripped out of ``API_BASE_URL`` so a single env var
      # drives both the public URL and the internal probe.
      test:
        - "CMD-SHELL"
        - >-
          if [ -z "$${HEALTHCHECK_HOST:-}$${API_BASE_URL:-}" ]; then
            echo "healthcheck: neither HEALTHCHECK_HOST nor API_BASE_URL is set" >&2;
            exit 1;
          fi;
          HOST="$${HEALTHCHECK_HOST:-$$(echo "$$API_BASE_URL" | sed -E 's|https?://([^/]+).*|\1|')}";
          curl --fail --silent --show-error --header "Host: $$HOST" http://localhost:8000/live >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      # GEE auth + lazy imports add 5–15 s before the app accepts
      # requests on first boot; 60 s margin so the container isn't
      # marked unhealthy before it can answer.
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
      geo-worker:
        condition: service_started
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Celery Worker (solo queue celery, sin GDAL) ---
  celery-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/jnzader/consorcio-canalero/backend:latest}
    container_name: consorcio-celery-worker
    restart: unless-stopped
    # ``--pool=prefork`` is REQUIRED — celery_app.purge_stale_refresh_tokens_task
    # uses ``asyncio.run`` which only works without an already-running event
    # loop. gevent / eventlet pools would crash that beat task.
    command: celery -A app.core.celery_app worker --pool=prefork --loglevel=info --concurrency=2 -Q celery
    env_file: .env
    volumes:
      - geo-data:/data/geo
    networks:
      - backend
      - consorcio-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Celery Beat (cron scheduler) ---
  # Phase 3 / F3-L. Without this service the beat_schedule entries in
  # app/core/celery_app.py never fire: alert evaluation, materialised-view
  # refresh, and the new refresh-token cleanup (auth.purge_stale_refresh_tokens)
  # all stay dormant.
  #
  # ⚠️ DO NOT scale this service. ``deploy.replicas: 1`` below is a
  # Swarm-only directive — plain ``docker compose up -d --scale celery-beat=2``
  # WILL spin two beat processes, both writing to the shared
  # ``celery-beat-schedule`` volume and corrupting the SQLite-style
  # schedule db. ``container_name`` below is the operational guard on
  # a single host. The real fix (Phase 4 backlog) is migrating to
  # ``celery-redbeat`` which uses Redis as the schedule store and
  # self-elects a leader.
  celery-beat:
    image: ${BACKEND_IMAGE:-ghcr.io/jnzader/consorcio-canalero/backend:latest}
    container_name: consorcio-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/var/run/celery/celerybeat-schedule
    env_file: .env
    volumes:
      # Scratch dir for the celerybeat-schedule db (no need to persist
      # across container rebuilds — beat re-reads schedule from code).
      - celery-beat-schedule:/var/run/celery
    networks:
      - backend
      - consorcio-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # --- Geo Worker (GDAL + WhiteboxTools, queue geo) ---
  geo-worker:
    image: ${GEO_WORKER_IMAGE:-ghcr.io/jnzader/consorcio-canalero/geo-worker:latest}
    container_name: consorcio-geo-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    volumes:
      - geo-data:/data/geo
    networks:
      - backend
      - consorcio-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Martin Vector Tile Server ---
  martin:
    image: ghcr.io/maplibre/martin:v0.14.2
    container_name: consorcio-martin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./martin-config.yaml:/config/config.yaml:ro
    command: --config /config/config.yaml
    environment:
      # Martin necesita URL sin +asyncpg (postgresql://, no postgresql+asyncpg://)
      - DATABASE_URL=${MARTIN_DB_URL}
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------
  # Backup runners (Phase 2 / F2-A + F2-B). Opt-in via the ``backup``
  # compose profile so they don't run unless explicitly invoked:
  #   docker compose --profile backup run --rm backup-postgres
  #   docker compose --profile backup run --rm backup-volumes
  # Schedule from the host crontab (see docs/RUNBOOK.md).
  # ---------------------------------------------------------------
  backup-postgres:
    profiles: ["backup"]
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: consorcio-backup-postgres
    restart: "no"
    env_file: .env  # supplies DATABASE_URL + the BACKUP_* / B2_* / HETZNER_SB_* vars
    command: ["/opt/backup/backup_postgres.sh"]
    networks:
      - backend
      - consorcio-internal

  backup-volumes:
    profiles: ["backup"]
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: consorcio-backup-volumes
    restart: "no"
    env_file: .env  # supplies RESTIC_* + B2_* / Storage Box creds
    volumes:
      # Mount the same volumes the backend / geo-worker write to,
      # read-only so a backup run can't accidentally mutate them.
      - geo-data:/data/geo:ro
      - denuncia-uploads:/app/uploads:ro
    command: ["/opt/backup/backup_volumes.sh"]
    networks:
      - backend
      - consorcio-internal

# Redes EXTERNAS — creadas una sola vez en el server:
#   docker network create proxy
#   docker network create backend
networks:
  proxy:
    external: true
  backend:
    external: true
  consorcio-internal:
    driver: bridge
    name: consorcio-internal

volumes:
  geo-data:
    name: consorcio-geo-data
  # Named volume so denuncia photos survive `docker compose up -d` and
  # image rebuilds. Back up with `docker run --rm -v consorcio-denuncia-uploads:/data ...`.
  denuncia-uploads:
    name: consorcio-denuncia-uploads
  # Scratch volume for the celery-beat schedule db. Beat re-reads the
  # schedule from code on startup so this doesn't need to be backed up.
  celery-beat-schedule:
    name: consorcio-celery-beat-schedule
