# ===========================================
# Docker Compose - Produccion (Hetzner / Dockge)
# ===========================================
# Frontend: Cloudflare Pages (NO incluido aqui).
# Esquema: imagenes pre-buildeadas desde GHCR.
# PostgreSQL y Redis son EXTERNOS (shared stack).
# Redes: proxy y backend son EXTERNAS (creadas una vez en el server).
#
# Arquitectura de dominios:
#   consorcio.DOMINIO       → Cloudflare Pages (frontend React)
#   api.consorcio.DOMINIO   → Caddy → consorcio-backend:8000
#   tiles.consorcio.DOMINIO → Caddy → consorcio-martin:3000
#
# Caddyfile en el server:
#   api.consorcio.{$DOMAIN} {
#     reverse_proxy consorcio-backend:8000
#   }
#   tiles.consorcio.{$DOMAIN} {
#     reverse_proxy consorcio-martin:3000
#   }
#
# Uso en servidor:
#   cp docker-compose.prod.yml /home/javier/stacks/consorcio/docker-compose.yml
#   cp .env.prod.example /home/javier/stacks/consorcio/.env  # editar con valores reales
#   cp martin/config.prod.yaml /home/javier/stacks/consorcio/martin-config.yaml
#   cd /home/javier/stacks/consorcio && docker compose up -d
# ===========================================

services:
  # --- One-shot DB migration runner ---
  # Runs `alembic upgrade head` against the production DB and exits 0.
  # The backend / celery-worker depend on this with
  # ``service_completed_successfully`` so they never start against an
  # out-of-date schema. If the migration fails, dependents don't start
  # and the deploy fails loudly instead of producing 500s at runtime.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/jnzader/consorcio-canalero/backend:latest}
    container_name: consorcio-migrate
    env_file: .env
    command: alembic upgrade head
    networks:
      - backend
      - consorcio-internal
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # --- Backend FastAPI ---
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jnzader/consorcio-canalero/backend:latest}
    container_name: consorcio-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - geo-data:/data/geo
      # User-uploaded denuncia photos live here. Without a named volume the
      # files vanish on every `docker compose up -d --pull` (image rebuild),
      # which is exactly what happened in past deploys.
      - denuncia-uploads:/app/uploads
    networks:
      - proxy
      - backend
      - consorcio-internal
    healthcheck:
      # Liveness only. /live doesn't touch DB/Redis/GEE — a transient
      # outage downstream must NOT kill this container. /ready (with
      # real dep checks + 503) is for load balancers, not Docker.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # GEE auth + lazy imports add 5–15 s before the app accepts
      # requests on first boot; 60 s margin so the container isn't
      # marked unhealthy before it can answer.
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      geo-worker:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Celery Worker (solo queue celery, sin GDAL) ---
  celery-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/jnzader/consorcio-canalero/backend:latest}
    container_name: consorcio-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 -Q celery
    env_file: .env
    volumes:
      - geo-data:/data/geo
    networks:
      - backend
      - consorcio-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Geo Worker (GDAL + WhiteboxTools, queue geo) ---
  geo-worker:
    image: ${GEO_WORKER_IMAGE:-ghcr.io/jnzader/consorcio-canalero/geo-worker:latest}
    container_name: consorcio-geo-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    volumes:
      - geo-data:/data/geo
    networks:
      - backend
      - consorcio-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Martin Vector Tile Server ---
  martin:
    image: ghcr.io/maplibre/martin:v0.14.2
    container_name: consorcio-martin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./martin-config.yaml:/config/config.yaml:ro
    command: --config /config/config.yaml
    environment:
      # Martin necesita URL sin +asyncpg (postgresql://, no postgresql+asyncpg://)
      - DATABASE_URL=${MARTIN_DB_URL}
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------
  # Backup runners (Phase 2 / F2-A + F2-B). Opt-in via the ``backup``
  # compose profile so they don't run unless explicitly invoked:
  #   docker compose --profile backup run --rm backup-postgres
  #   docker compose --profile backup run --rm backup-volumes
  # Schedule from the host crontab (see docs/RUNBOOK.md).
  # ---------------------------------------------------------------
  backup-postgres:
    profiles: ["backup"]
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: consorcio-backup-postgres
    restart: "no"
    env_file: .env  # supplies DATABASE_URL + the BACKUP_* / B2_* / HETZNER_SB_* vars
    command: ["/opt/backup/backup_postgres.sh"]
    networks:
      - backend
      - consorcio-internal

  backup-volumes:
    profiles: ["backup"]
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: consorcio-backup-volumes
    restart: "no"
    env_file: .env  # supplies RESTIC_* + B2_* / Storage Box creds
    volumes:
      # Mount the same volumes the backend / geo-worker write to,
      # read-only so a backup run can't accidentally mutate them.
      - geo-data:/data/geo:ro
      - denuncia-uploads:/app/uploads:ro
    command: ["/opt/backup/backup_volumes.sh"]
    networks:
      - backend
      - consorcio-internal

# Redes EXTERNAS — creadas una sola vez en el server:
#   docker network create proxy
#   docker network create backend
networks:
  proxy:
    external: true
  backend:
    external: true
  consorcio-internal:
    driver: bridge
    name: consorcio-internal

volumes:
  geo-data:
    name: consorcio-geo-data
  # Named volume so denuncia photos survive `docker compose up -d` and
  # image rebuilds. Back up with `docker run --rm -v consorcio-denuncia-uploads:/data ...`.
  denuncia-uploads:
    name: consorcio-denuncia-uploads
