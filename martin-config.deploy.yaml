# Martin Vector Tile Server - legacy embedded production stack
# docker-compose.deploy.yml injects DATABASE_URL from MARTIN_DB_URL.
# Keep this exact allowlist aligned with martin/config.prod.yaml.

listen_addresses: '0.0.0.0:3000'

postgres:
  connection_string: ${DATABASE_URL}

  # Never discover schemas automatically: Martin's hostname is public and
  # PostgreSQL table columns become vector-tile properties. Only sanitized
  # projection views are publishable.
  auto_publish: false
  functions: {}
  tables:
    # Catastro rural (IDECOR): el mapa publico SOLO dibuja los poligonos
    # (fill+line); ninguna propiedad del tile se lee en el cliente. La vista
    # vt_parcelas_catastro proyecta unicamente la geometria — nro_cuenta y el
    # resto de las columnas de la tabla base quedan afuera del tile. El nombre
    # de fuente es parcelas_catastro porque es el source-layer que el frontend
    # pide (mapLayerEffectHelpers.ts). Sin id_column: el id de la tabla es
    # UUID y Martin exige entero (mvt_agg_transfn fallaba con 500).
    parcelas_catastro:
      schema: public
      table: vt_parcelas_catastro
      srid: 4326
      geometry_column: geometria
      # Los 7 campos del whitelist del frontend (layerPropertyWhitelists.ts
      # 'catastro'): el popup del mapa lee las propiedades DEL TILE via
      # queryRenderedFeatures — solo-geometria rompia el click en parcela.
      # Todos ya son publicos via el asset estatico catastro_rural_cu.geojson;
      # quedan afuera id/par_idparcela/created_at (plomeria interna).
      properties:
        nro_cuenta: Cuenta catastral
        desig_oficial: Designacion oficial
        superficie_ha: Superficie (ha)
        departamento: Departamento
        pedania: Pedania
        nomenclatura: Nomenclatura
        tipo_parcela: Tipo de parcela
    vt_zonas_operativas:
      schema: public
      table: vt_zonas_operativas
      srid: 4326
      geometry_column: geometria
      id_column: id
      properties:
        id: Public identifier
        nombre: Zone name
        cuenca: Basin name
        superficie_ha: Area in hectares
    vt_puntos_conflicto:
      schema: public
      table: vt_puntos_conflicto
      srid: 4326
      geometry_column: geometria
      id_column: id
      properties:
        id: Public identifier
        tipo: Conflict type
        severidad: Severity
        descripcion: Public description
        acumulacion_valor: Accumulation metric
        pendiente_valor: Slope metric
    vt_canal_network:
      schema: public
      table: vt_canal_network
      srid: 4326
      geometry_column: geom
      id_column: id
      properties:
        id: Public identifier
        nombre: Canal name
        tipo: Canal type
        source: Topology source node
        target: Topology target node
        cost: Routing cost
